name: Bug report
description: Report a reproducible problem with EchoEar Flight Radar
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first and remove credentials, API keys, exact home coordinates, access tokens, and private URLs from everything you submit.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what part of the radar is affected?
      placeholder: Describe the observed behavior and when it began.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Power on the device
        2. Select ...
        3. Tap ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: esphome-version
    attributes:
      label: ESPHome version
      placeholder: 2026.x.x
    validations:
      required: true

  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.x.x
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - EchoEar v1.1
        - Another ESP32 device or custom port
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - ESPHome Device Builder or Home Assistant add-on
        - ESPHome CLI
        - Other
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration changes
      description: Describe changes from the repository YAML. Do not paste secrets or private coordinates.
      placeholder: No changes, or a concise list of substitutions and component changes.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the smallest useful ESPHome log section and redact sensitive values.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add photos, screenshots, selected range, map details, or other useful context.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, API keys, tokens, exact home coordinates, and other private information.
          required: true
