substitutions:
  name: echoear-flight-radar
  friendly_name: EchoEar Flight Radar
  imagewidth: "360"
  imageheight: "360"
  rotate_display: "0"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  cpu_frequency: 240MHz
  toolchain: esp-idf
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      loop_task_stack_size: 16384
      use_full_certificate_bundle: true
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.1
  name_add_mac_suffix: false
  compile_process_limit: 4
  includes:
    - assets/flight_radar_map_metadata.h
  on_boot:
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: flight_radar_status
            state: "starting"
        - script.execute: flight_radar_fetch

external_components:
  - source:
      type: local
      path: components
    components:
      - async_flight_radar

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

debug:
  update_interval: 30s

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_password
  on_connect:
    - text_sensor.template.publish:
        id: flight_radar_status
        state: "waiting for Home Assistant"
    - script.execute: flight_radar_fetch
  on_disconnect:
    - text_sensor.template.publish:
        id: flight_radar_status
        state: "offline"

captive_portal:

api:
  on_client_connected:
    - script.execute: flight_radar_fetch

json:

time:
  - platform: homeassistant
    id: device_time

async_flight_radar:
  id: async_radar_http
  aeroapi_key: !secret aeroapi_key
  timeout: 10s
  max_response_size: 32768
  buffer_size_rx: 2048
  buffer_size_tx: 512
  on_response:
    then:
      - lambda: |-
          id(flight_radar_fetch_in_progress) = false;
          id(flight_radar_fetch_duration_ms) = duration_ms;
          id(flight_radar_http_status_code) = status_code;
          id(flight_radar_payload_bytes) = static_cast<int>(body_length);
          id(flight_radar_fetch_duration_ms_sensor).publish_state(duration_ms);
          id(flight_radar_http_status_sensor).publish_state(status_code);
          id(flight_radar_payload_bytes_sensor).publish_state(body_length);

          if (status_code != 200) {
            char error[48];
            snprintf(error, sizeof(error), "HTTP %d", status_code);
            id(flight_radar_breadcrumb).publish_state(error);
            id(flight_radar_status).publish_state("error");
            id(flight_radar_last_error).publish_state(error);
            return;
          }

          std::string payload;
          payload.reserve(8192);
          int count = 0;

          auto parsed = json::parse_json(
              reinterpret_cast<const uint8_t *>(body), body_length,
              [&](JsonObject root) -> bool {
                JsonArray aircraft = root["ac"].as<JsonArray>();
                if (aircraft.isNull()) return true;

                float response_delivery_age =
                    std::min(10.0f, (float) duration_ms / 1000.0f);
                if (!root["now"].isNull()) {
                  struct timeval receive_time {};
                  if (gettimeofday(&receive_time, nullptr) == 0
                      && receive_time.tv_sec > 1700000000) {
                    const double local_now =
                        (double) receive_time.tv_sec
                        + (double) receive_time.tv_usec / 1000000.0;
                    const double server_now = root["now"].as<double>();
                    const double delivery_age = local_now - server_now;
                    if (delivery_age >= -0.5 && delivery_age <= 15.0) {
                      response_delivery_age =
                          std::max(0.0f, (float) delivery_age);
                    }
                  }
                }

                auto read_float = [](JsonObject object, const char *key,
                                     float *value) -> bool {
                  if (object[key].is<float>() || object[key].is<double>()
                      || object[key].is<int>()) {
                    *value = object[key].as<float>();
                    return true;
                  }
                  return false;
                };

                auto clean = [](const char *input, size_t max_len) -> std::string {
                  std::string output;
                  if (input == nullptr || max_len == 0) return output;
                  for (const char *p = input; *p != '\0' && output.size() < max_len; ++p) {
                    char c = *p;
                    if (c == '|' || c == ';' || c == '\r' || c == '\n' || c == '\t') {
                      c = ' ';
                    }
                    if ((unsigned char) c < 32 || (unsigned char) c > 126) continue;
                    output.push_back(c);
                  }
                  while (!output.empty() && output.back() == ' ') output.pop_back();
                  return output;
                };

                for (JsonObject plane : aircraft) {
                  if (count >= 48) break;

                  float lat = 0.0f;
                  float lon = 0.0f;
                  if (!read_float(plane, "lat", &lat)
                      || !read_float(plane, "lon", &lon)) {
                    continue;
                  }

                  if (plane["alt_baro"].is<const char *>()) {
                    const char *altitude = plane["alt_baro"].as<const char *>();
                    if (altitude != nullptr && strcmp(altitude, "ground") == 0) continue;
                  }

                  float nose = 0.0f;
                  float track = 0.0f;
                  float ground_speed = 0.0f;
                  float value = 0.0f;
                  if (read_float(plane, "true_heading", &value)) nose = value;
                  else if (read_float(plane, "mag_heading", &value)) nose = value;
                  else if (read_float(plane, "track", &value)) nose = value;

                  if (read_float(plane, "track", &value)) track = value;
                  else if (read_float(plane, "true_heading", &value)) track = value;
                  else if (read_float(plane, "mag_heading", &value)) track = value;

                  if (read_float(plane, "gs", &value)) ground_speed = value;
                  else if (read_float(plane, "tas", &value)) ground_speed = value;
                  else if (read_float(plane, "ias", &value)) ground_speed = value;

                  float seen_position = 0.0f;
                  if (!read_float(plane, "seen_pos", &seen_position)) {
                    seen_position = 0.0f;
                  }
                  seen_position = std::max(0.0f,
                                           std::min(120.0f, seen_position));
                  const float position_age =
                      seen_position + response_delivery_age;

                  const std::string callsign = clean(
                      plane["flight"].is<const char *>()
                          ? plane["flight"].as<const char *>()
                          : nullptr,
                      10);
                  const std::string hex = clean(
                      plane["hex"].is<const char *>()
                          ? plane["hex"].as<const char *>()
                          : nullptr,
                      9);
                  const std::string type = clean(
                      plane["t"].is<const char *>()
                          ? plane["t"].as<const char *>()
                          : nullptr,
                      6);
                  const std::string description = clean(
                      plane["desc"].is<const char *>()
                          ? plane["desc"].as<const char *>()
                           : nullptr,
                      34);
                  const std::string registration = clean(
                      plane["r"].is<const char *>()
                          ? plane["r"].as<const char *>()
                          : nullptr,
                      15);
                  const std::string source_type = clean(
                      plane["type"].is<const char *>()
                          ? plane["type"].as<const char *>()
                          : nullptr,
                      12);
                  bool position_mlat = source_type == "mlat";
                  JsonArray mlat_fields = plane["mlat"].as<JsonArray>();
                  if (!mlat_fields.isNull()) {
                    for (JsonVariant field : mlat_fields) {
                      if (!field.is<const char *>()) continue;
                      const char *field_name = field.as<const char *>();
                      if (field_name != nullptr
                          && (strcmp(field_name, "lat") == 0
                              || strcmp(field_name, "lon") == 0)) {
                        position_mlat = true;
                      }
                    }
                  }
                  int nic = -1;
                  int rc = -1;
                  if (read_float(plane, "nic", &value)) nic = (int) lroundf(value);
                  if (read_float(plane, "rc", &value)) rc = (int) lroundf(value);

                  char altitude[16] = "";
                  float altitude_value = 0.0f;
                  if (read_float(plane, "alt_baro", &altitude_value)
                      || read_float(plane, "alt_geom", &altitude_value)) {
                    snprintf(altitude, sizeof(altitude), "%d ft",
                             (int) lroundf(altitude_value));
                  }

                  if (id(flight_detail_active)
                      && !id(flight_detail_selected_hex).empty()
                      && id(flight_detail_selected_hex) == hex) {
                    id(flight_detail_selected_lat) = lat;
                    id(flight_detail_selected_lon) = lon;
                    id(flight_detail_selected_ground_speed) = ground_speed;
                    id(flight_detail_selected_callsign) = callsign;
                    id(flight_detail_selected_type) = type;
                    id(flight_detail_selected_description) = description;
                    id(flight_detail_selected_registration) = registration;
                    id(flight_detail_selected_altitude) = altitude;
                  }

                  char record[300];
                  snprintf(record, sizeof(record),
                           "%.5f|%.5f|%.1f|%.1f|%.1f|%s|%s|%s|%s|%s|%s|%.2f|%s|%d|%d|%d;",
                           lat, lon, nose, track, ground_speed,
                           callsign.c_str(), type.c_str(), altitude,
                           hex.c_str(), description.c_str(), registration.c_str(),
                           position_age, source_type.c_str(),
                           position_mlat ? 1 : 0, nic, rc);
                  payload += record;
                  count++;
                }
                return true;
              });

          if (!parsed) {
            id(flight_radar_breadcrumb).publish_state("json parse failed");
            id(flight_radar_status).publish_state("error");
            id(flight_radar_last_error).publish_state("JSON parse failed");
            return;
          }

          id(flight_radar_aircraft_payload) = payload;
          id(flight_radar_payload_generation)++;
          id(flight_radar_last_success_ms) = millis();
          id(flight_radar_aircraft_count).publish_state(count);
          id(flight_radar_status).publish_state(count > 0 ? "ok" : "empty");
          id(flight_radar_last_error).publish_state("");

          char breadcrumb[64];
          snprintf(breadcrumb, sizeof(breadcrumb),
                   "fetch ok %ums %d ac %dB",
                   (unsigned) duration_ms,
                   count,
                   id(flight_radar_payload_bytes));
          id(flight_radar_breadcrumb).publish_state(breadcrumb);
          id(flight_detail_prefetch).execute();
  on_error:
    then:
      - lambda: |-
          id(flight_radar_fetch_in_progress) = false;
          id(flight_radar_fetch_duration_ms) = duration_ms;
          id(flight_radar_http_status_code) = -1;
          id(flight_radar_payload_bytes) = 0;
          id(flight_radar_fetch_duration_ms_sensor).publish_state(duration_ms);
          id(flight_radar_http_status_sensor).publish_state(-1);
          id(flight_radar_payload_bytes_sensor).publish_state(0);
          id(flight_radar_status).publish_state("error");
          id(flight_radar_last_error).publish_state(error);

          char breadcrumb[96];
          snprintf(breadcrumb, sizeof(breadcrumb), "request failed: %.72s", error.c_str());
          id(flight_radar_breadcrumb).publish_state(breadcrumb);
  on_enrichment_response:
    then:
      - lambda: |-
          id(flight_detail_fetch_in_progress) = false;

          auto finish = [&]() {
            if (id(flight_detail_active)) id(flight_detail_apply_cached).execute();
            id(flight_detail_prefetch).execute();
          };
          auto unavailable = [&]() {
            id(async_radar_http).store_enrichment_unavailable(callsign, aircraft_hex);
            char breadcrumb[64];
            snprintf(breadcrumb, sizeof(breadcrumb), "prefetch %.15s unavailable",
                     callsign.c_str());
            id(flight_radar_breadcrumb).publish_state(breadcrumb);
            finish();
          };

          if (status_code == 404) {
            unavailable();
            return;
          }
          if (status_code != 200) {
            id(async_radar_http).store_enrichment_error(callsign, aircraft_hex);
            char breadcrumb[64];
            snprintf(breadcrumb, sizeof(breadcrumb), "prefetch %.15s HTTP %d",
                     callsign.c_str(), status_code);
            id(flight_radar_breadcrumb).publish_state(breadcrumb);
            finish();
            return;
          }

          std::string airline_name;
          std::string origin_city;
          std::string origin_code;
          std::string destination_city;
          std::string destination_code;
          float origin_lat = 0.0f;
          float origin_lon = 0.0f;
          float destination_lat = 0.0f;
          float destination_lon = 0.0f;
          bool route_present = false;
          bool route_positions_valid = false;

          auto parsed = json::parse_json(
              reinterpret_cast<const uint8_t *>(body), body_length,
              [&](JsonObject root) -> bool {
                JsonObject response_object = root["response"].as<JsonObject>();
                if (response_object.isNull()) return true;
                JsonObject route = response_object["flightroute"].as<JsonObject>();
                if (route.isNull()) return true;
                route_present = true;

                auto clean = [](const char *input, size_t max_len) -> std::string {
                  std::string output;
                  if (input == nullptr || max_len == 0) return output;
                  for (const char *p = input;
                       *p != '\0' && output.size() < max_len; ++p) {
                    char character = *p;
                    if (character == '|' || character == ';' || character == '\r'
                        || character == '\n' || character == '\t') {
                      character = ' ';
                    }
                    if ((unsigned char) character < 32
                        || (unsigned char) character > 126) continue;
                    output.push_back(character);
                  }
                  while (!output.empty() && output.back() == ' ') output.pop_back();
                  size_t first = 0;
                  while (first < output.size() && output[first] == ' ') first++;
                  if (first > 0) output.erase(0, first);
                  return output;
                };

                auto read_coordinate = [](JsonObject object, const char *key,
                                          float *value) -> bool {
                  if (object[key].is<float>() || object[key].is<double>()
                      || object[key].is<int>()) {
                    *value = object[key].as<float>();
                    return true;
                  }
                  return false;
                };

                JsonObject airline = route["airline"].as<JsonObject>();
                JsonObject origin = route["origin"].as<JsonObject>();
                JsonObject destination = route["destination"].as<JsonObject>();
                if (origin.isNull() || destination.isNull()) return true;

                airline_name = airline.isNull()
                    ? ""
                    : clean(airline["name"].is<const char *>()
                                ? airline["name"].as<const char *>()
                                : nullptr,
                            32);
                origin_city = clean(
                    origin["municipality"].is<const char *>()
                        ? origin["municipality"].as<const char *>()
                        : nullptr,
                    24);
                if (origin_city.empty()) {
                  origin_city = clean(
                      origin["name"].is<const char *>()
                          ? origin["name"].as<const char *>()
                          : nullptr,
                      24);
                }
                origin_code = clean(
                    origin["iata_code"].is<const char *>()
                        ? origin["iata_code"].as<const char *>()
                        : nullptr,
                    5);
                if (origin_code.empty()) {
                  origin_code = clean(
                      origin["icao_code"].is<const char *>()
                          ? origin["icao_code"].as<const char *>()
                          : nullptr,
                      5);
                }
                destination_city = clean(
                    destination["municipality"].is<const char *>()
                        ? destination["municipality"].as<const char *>()
                        : nullptr,
                    24);
                if (destination_city.empty()) {
                  destination_city = clean(
                      destination["name"].is<const char *>()
                          ? destination["name"].as<const char *>()
                          : nullptr,
                      24);
                }
                destination_code = clean(
                    destination["iata_code"].is<const char *>()
                        ? destination["iata_code"].as<const char *>()
                        : nullptr,
                    5);
                if (destination_code.empty()) {
                  destination_code = clean(
                      destination["icao_code"].is<const char *>()
                          ? destination["icao_code"].as<const char *>()
                          : nullptr,
                      5);
                }

                route_positions_valid =
                    read_coordinate(origin, "latitude", &origin_lat)
                    && read_coordinate(origin, "longitude", &origin_lon)
                    && read_coordinate(destination, "latitude", &destination_lat)
                    && read_coordinate(destination, "longitude", &destination_lon);
                return true;
              });

          if (!parsed) {
            id(async_radar_http).store_enrichment_error(callsign, aircraft_hex);
            id(flight_radar_breadcrumb).publish_state("prefetch JSON error");
            finish();
            return;
          }
          if (!route_present || origin_city.empty() || destination_city.empty()) {
            unavailable();
            return;
          }

          id(async_radar_http).store_enrichment_ready(
              callsign, aircraft_hex, airline_name,
              origin_city, origin_code, origin_lat, origin_lon,
              destination_city, destination_code,
              destination_lat, destination_lon, route_positions_valid);
          char breadcrumb[64];
          snprintf(breadcrumb, sizeof(breadcrumb), "prefetch %.15s ready",
                   callsign.c_str());
          id(flight_radar_breadcrumb).publish_state(breadcrumb);
          finish();
  on_enrichment_error:
    then:
      - lambda: |-
          id(flight_detail_fetch_in_progress) = false;
          id(async_radar_http).store_enrichment_error(callsign, aircraft_hex);
          char breadcrumb[80];
          snprintf(breadcrumb, sizeof(breadcrumb), "prefetch %.15s failed: %.36s",
                   callsign.c_str(), error.c_str());
          id(flight_radar_breadcrumb).publish_state(breadcrumb);
          if (id(flight_detail_active)) id(flight_detail_apply_cached).execute();
          id(flight_detail_prefetch).execute();
  on_flight_times_response:
    then:
      - lambda: |-
          id(flight_times_http_status_sensor).publish_state(status_code);
          id(flight_times_request_duration_sensor).publish_state(duration_ms);
          id(flight_times_last_error_sensor).publish_state("");

          auto publish_status = [&](const char *status) {
            id(flight_times_status) = status;
            id(flight_times_status_sensor).publish_state(status);
          };
          auto record_failure = [&](const char *status, const char *message) {
            id(flight_times_failures)++;
            publish_status(status);
            id(flight_radar_breadcrumb).publish_state(message);
          };

          if (status_code != 200) {
            char message[64];
            snprintf(message, sizeof(message), "AeroAPI %.15s HTTP %d",
                     callsign.c_str(), status_code);
            id(flight_times_last_error_sensor).publish_state(message);
            record_failure("http_error", message);
            return;
          }

          const auto now = id(device_time).now();
          if (!now.is_valid()) {
            record_failure("clock_error", "AeroAPI response without valid clock");
            return;
          }
          const int64_t now_epoch = static_cast<int64_t>(now.timestamp);

          auto normalize = [](const std::string &input) -> std::string {
            std::string output;
            output.reserve(input.size());
            for (char character : input) {
              if (character >= 'a' && character <= 'z') character -= 'a' - 'A';
              if ((character >= 'A' && character <= 'Z')
                  || (character >= '0' && character <= '9')) {
                output.push_back(character);
              }
            }
            return output;
          };
          auto read_text = [](JsonObject object, const char *key) -> std::string {
            if (!object[key].is<const char *>()) return "";
            const char *value = object[key].as<const char *>();
            return value == nullptr ? "" : std::string(value);
          };
          auto clean_text = [](const std::string &input, size_t max_len) -> std::string {
            std::string output;
            output.reserve(std::min(input.size(), max_len));
            for (char character : input) {
              if (output.size() >= max_len) break;
              if (character == '|' || character == ';' || character == '\r'
                  || character == '\n' || character == '\t') {
                character = ' ';
              }
              if ((unsigned char) character < 32 || (unsigned char) character > 126) continue;
              output.push_back(character);
            }
            while (!output.empty() && output.back() == ' ') output.pop_back();
            size_t first = 0;
            while (first < output.size() && output[first] == ' ') first++;
            if (first > 0) output.erase(0, first);
            return output;
          };
          auto parse_utc = [](const std::string &value) -> int64_t {
            int year = 0;
            int month = 0;
            int day = 0;
            int hour = 0;
            int minute = 0;
            int second = 0;
            if (sscanf(value.c_str(), "%d-%d-%dT%d:%d:%d",
                       &year, &month, &day, &hour, &minute, &second) != 6) {
              return 0;
            }
            if (year < 1970 || month < 1 || month > 12 || day < 1 || day > 31
                || hour < 0 || hour > 23 || minute < 0 || minute > 59
                || second < 0 || second > 60) {
              return 0;
            }
            const int adjusted_year = year - (month <= 2 ? 1 : 0);
            const int era = (adjusted_year >= 0 ? adjusted_year : adjusted_year - 399) / 400;
            const unsigned year_of_era = static_cast<unsigned>(adjusted_year - era * 400);
            const unsigned shifted_month = static_cast<unsigned>(month + (month > 2 ? -3 : 9));
            const unsigned day_of_year =
                (153U * shifted_month + 2U) / 5U + static_cast<unsigned>(day) - 1U;
            const unsigned day_of_era =
                year_of_era * 365U + year_of_era / 4U - year_of_era / 100U
                + day_of_year;
            const int64_t days = static_cast<int64_t>(era) * 146097LL
                + static_cast<int64_t>(day_of_era) - 719468LL;
            return days * 86400LL + hour * 3600LL + minute * 60LL + second;
          };

          const std::string requested_callsign = normalize(callsign);
          const std::string requested_registration = normalize(registration);
          const bool same_selection =
              (!aircraft_hex.empty() && aircraft_hex == id(flight_detail_selected_hex))
              || (aircraft_hex.empty()
                  && requested_callsign == normalize(id(flight_detail_selected_callsign)));
          const std::string expected_origin =
              same_selection && id(flight_detail_route_status) == "ready"
                  ? normalize(id(flight_detail_origin_code))
                  : "";
          const std::string expected_destination =
              same_selection && id(flight_detail_route_status) == "ready"
                  ? normalize(id(flight_detail_destination_code))
                  : "";

          auto airport_matches = [&](JsonObject airport,
                                     const std::string &expected) -> bool {
            if (expected.empty()) return true;
            if (airport.isNull()) return false;
            return normalize(read_text(airport, "code")) == expected
                || normalize(read_text(airport, "code_icao")) == expected
                || normalize(read_text(airport, "code_iata")) == expected
                || normalize(read_text(airport, "code_lid")) == expected;
          };
          auto airport_city = [&](JsonObject airport) -> std::string {
            std::string city = clean_text(read_text(airport, "city"), 24);
            if (city.empty()) city = clean_text(read_text(airport, "name"), 24);
            return city;
          };
          auto airport_code = [&](JsonObject airport) -> std::string {
            std::string code = normalize(read_text(airport, "code_iata"));
            if (code.empty()) code = normalize(read_text(airport, "code_icao"));
            if (code.empty()) code = normalize(read_text(airport, "code"));
            if (code.size() > 5) code.resize(5);
            return code;
          };

          int best_score = -1;
          bool best_tied = false;
          int64_t best_actual_off = 0;
          int64_t best_estimated_on = 0;
          std::string best_ident;
          std::string best_operator;
          std::string best_origin_city;
          std::string best_origin_code;
          std::string best_destination_city;
          std::string best_destination_code;

          const bool parsed = json::parse_json(
              reinterpret_cast<const uint8_t *>(body), body_length,
              [&](JsonObject root) -> bool {
                JsonArray flights = root["flights"].as<JsonArray>();
                if (flights.isNull()) return true;

                for (JsonObject flight : flights) {
                  const std::string ident = normalize(read_text(flight, "ident"));
                  const std::string ident_icao = normalize(read_text(flight, "ident_icao"));
                  const std::string atc_ident = normalize(read_text(flight, "atc_ident"));
                  const std::string candidate_registration =
                      normalize(read_text(flight, "registration"));

                  int score = -1;
                  if (!atc_ident.empty() && atc_ident == requested_callsign) score = 120;
                  else if ((!ident_icao.empty() && ident_icao == requested_callsign)
                           || (!ident.empty() && ident == requested_callsign)) score = 100;
                  else if (!requested_registration.empty()
                           && candidate_registration == requested_registration) score = 60;
                  if (score < 0) continue;

                  if (!requested_registration.empty()
                      && !candidate_registration.empty()
                      && candidate_registration != requested_registration) {
                    continue;
                  }
                  if (!requested_registration.empty()
                      && candidate_registration == requested_registration) score += 40;

                  const int64_t actual_off =
                      parse_utc(read_text(flight, "actual_off"));
                  const int64_t estimated_on =
                      parse_utc(read_text(flight, "estimated_on"));
                  const int64_t actual_on =
                      parse_utc(read_text(flight, "actual_on"));
                  if (actual_off <= 0 || estimated_on <= 0 || actual_on > 0) continue;
                  if (actual_off > now_epoch + 15LL * 60LL
                      || estimated_on < now_epoch - 2LL * 60LL * 60LL) {
                    continue;
                  }

                  JsonObject origin = flight["origin"].as<JsonObject>();
                  JsonObject destination = flight["destination"].as<JsonObject>();
                  if (!expected_origin.empty()
                      && airport_matches(origin, expected_origin)) score += 15;
                  if (!expected_destination.empty()
                      && airport_matches(destination, expected_destination)) score += 15;

                  const std::string status = read_text(flight, "status");
                  if (status.find("En Route") != std::string::npos) score += 10;
                  if (flight["progress_percent"].is<int>()) {
                    const int progress = flight["progress_percent"].as<int>();
                    if (progress > 0 && progress < 100) score += 5;
                  }

                  if (score > best_score) {
                    best_score = score;
                    best_tied = false;
                    best_actual_off = actual_off;
                    best_estimated_on = estimated_on;
                    best_ident = ident.empty() ? ident_icao : ident;
                    best_operator = normalize(read_text(flight, "operator_icao"));
                    if (best_operator.empty()) {
                      best_operator = normalize(read_text(flight, "operator"));
                    }
                    best_origin_city = airport_city(origin);
                    best_origin_code = airport_code(origin);
                    best_destination_city = airport_city(destination);
                    best_destination_code = airport_code(destination);
                  } else if (score == best_score) {
                    best_tied = true;
                  }
                }
                return true;
              });

          if (!parsed) {
            id(flight_times_last_error_sensor).publish_state("JSON parse failed");
            record_failure("parse_error", "AeroAPI JSON parse failed");
            return;
          }
          if (best_score < 0 || best_tied) {
            publish_status("unavailable");
            char message[72];
            snprintf(message, sizeof(message), "AeroAPI %.15s %s",
                     callsign.c_str(), best_tied ? "ambiguous" : "no active match");
            id(flight_radar_breadcrumb).publish_state(message);
            return;
          }

          id(flight_times_cache_key) = aircraft_hex.empty()
              ? requested_callsign
              : normalize(aircraft_hex);
          id(flight_times_actual_off_epoch) = best_actual_off;
          id(flight_times_estimated_on_epoch) = best_estimated_on;
          id(flight_times_cached_at_ms) = millis();
          publish_status("ready");

          if (!best_origin_city.empty() && !best_destination_city.empty()) {
            id(async_radar_http).merge_enrichment_route(
                callsign, aircraft_hex, best_origin_city, best_origin_code,
                best_destination_city, best_destination_code);
            if (same_selection) id(flight_detail_apply_cached).execute();
          }

          const auto *enrichment = id(async_radar_http).find_enrichment(callsign);
          if (same_selection && !best_operator.empty()
              && (enrichment == nullptr || enrichment->airline[0] == '\0')
              && !id(async_radar_http).is_flight_operator_running()) {
            char operator_url[160];
            snprintf(operator_url, sizeof(operator_url),
                     "https://aeroapi.flightaware.com/aeroapi/operators/%s",
                     best_operator.c_str());
            if (id(async_radar_http).start_flight_operator(
                    std::string(operator_url), callsign, aircraft_hex, best_operator)) {
              char operator_message[72];
              snprintf(operator_message, sizeof(operator_message),
                       "AeroAPI %.15s operator %.7s queued",
                       callsign.c_str(), best_operator.c_str());
              id(flight_radar_breadcrumb).publish_state(operator_message);
            }
          }

          char message[80];
          snprintf(message, sizeof(message), "AeroAPI %.15s ready as %.15s",
                   callsign.c_str(), best_ident.c_str());
          id(flight_radar_breadcrumb).publish_state(message);
  on_flight_times_error:
    then:
      - lambda: |-
          id(flight_times_failures)++;
          id(flight_times_status) = "transport_error";
          id(flight_times_status_sensor).publish_state("transport_error");
          id(flight_times_http_status_sensor).publish_state(-1);
          id(flight_times_request_duration_sensor).publish_state(duration_ms);
          id(flight_times_last_error_sensor).publish_state(error);
          char message[88];
          snprintf(message, sizeof(message), "AeroAPI %.15s failed: %.42s",
                   callsign.c_str(), error.c_str());
          id(flight_radar_breadcrumb).publish_state(message);
  on_flight_operator_response:
    then:
      - lambda: |-
          if (status_code != 200) {
            char message[72];
            snprintf(message, sizeof(message), "AeroAPI operator %.7s HTTP %d",
                     operator_code.c_str(), status_code);
            id(flight_radar_breadcrumb).publish_state(message);
            return;
          }

          auto normalize = [](const std::string &input) -> std::string {
            std::string output;
            output.reserve(input.size());
            for (char character : input) {
              if (character >= 'a' && character <= 'z') character -= 'a' - 'A';
              if ((character >= 'A' && character <= 'Z')
                  || (character >= '0' && character <= '9')) {
                output.push_back(character);
              }
            }
            return output;
          };
          auto clean = [](const char *input, size_t max_len) -> std::string {
            std::string output;
            if (input == nullptr) return output;
            for (const char *cursor = input;
                 *cursor != '\0' && output.size() < max_len; ++cursor) {
              char character = *cursor;
              if (character == '|' || character == ';' || character == '\r'
                  || character == '\n' || character == '\t') {
                character = ' ';
              }
              if ((unsigned char) character < 32 || (unsigned char) character > 126) continue;
              output.push_back(character);
            }
            while (!output.empty() && output.back() == ' ') output.pop_back();
            return output;
          };

          std::string airline;
          std::string returned_operator;
          const bool parsed = json::parse_json(
              reinterpret_cast<const uint8_t *>(body), body_length,
              [&](JsonObject root) -> bool {
                returned_operator = normalize(
                    root["icao"].is<const char *>()
                        ? root["icao"].as<const char *>() : "");
                const char *name = root["name"].is<const char *>()
                    ? root["name"].as<const char *>() : nullptr;
                if (name == nullptr || *name == '\0') {
                  name = root["shortname"].is<const char *>()
                      ? root["shortname"].as<const char *>() : nullptr;
                }
                if (name == nullptr || *name == '\0') {
                  name = root["callsign"].is<const char *>()
                      ? root["callsign"].as<const char *>() : nullptr;
                }
                airline = clean(name, 32);
                return true;
              });

          if (!parsed || airline.empty()
              || (!returned_operator.empty()
                  && returned_operator != normalize(operator_code))) {
            char message[72];
            snprintf(message, sizeof(message), "AeroAPI operator %.7s unavailable",
                     operator_code.c_str());
            id(flight_radar_breadcrumb).publish_state(message);
            return;
          }

          id(async_radar_http).merge_enrichment_airline(
              callsign, aircraft_hex, airline);
          const bool same_selection =
              (!aircraft_hex.empty() && aircraft_hex == id(flight_detail_selected_hex))
              || (aircraft_hex.empty()
                  && normalize(callsign) == normalize(id(flight_detail_selected_callsign)));
          if (id(flight_detail_active) && same_selection) {
            id(flight_detail_apply_cached).execute();
          }

          char message[80];
          snprintf(message, sizeof(message), "AeroAPI %.15s airline %.32s",
                   callsign.c_str(), airline.c_str());
          id(flight_radar_breadcrumb).publish_state(message);
  on_flight_operator_error:
    then:
      - lambda: |-
          char message[88];
          snprintf(message, sizeof(message), "AeroAPI operator %.7s failed: %.42s",
                   operator_code.c_str(), error.c_str());
          id(flight_radar_breadcrumb).publish_state(message);

