interval:
  - interval: 2s
    then:
      - script.execute: flight_detail_prefetch

  - interval: 5s
    then:
      - script.execute: flight_radar_fetch

  - interval: 60s
    then:
      - lambda: |-
          using esphome::i2c::ERROR_OK;
          constexpr uint8_t BQ_ADDR = 0x55;
          constexpr uint8_t REG_VOLTAGE = 0x08;
          uint8_t reg = REG_VOLTAGE;
          uint8_t rx[2] = {0};

          if (id(bus_a)->write(BQ_ADDR, &reg, 1) != ERROR_OK) {
            ESP_LOGW("bq27220", "I2C write failed");
            return;
          }
          delayMicroseconds(200);
          if (id(bus_a)->read(BQ_ADDR, rx, 2) != ERROR_OK) {
            ESP_LOGW("bq27220", "I2C read failed");
            return;
          }

          const uint16_t mv = (uint16_t(rx[1]) << 8) | rx[0];
          id(battery_voltage).publish_state(mv / 1000.0f);

script:
  - id: flight_radar_fetch
    mode: single
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: |-
                  return !id(flight_radar_fetch_in_progress)
                      && !id(async_radar_http).is_flight_times_running()
                      && id(ha_home_latitude).has_state()
                      && id(ha_home_longitude).has_state()
                      && (id(flight_radar_last_fetch_ms) == 0
                          || millis() - id(flight_radar_last_fetch_ms) >= 4500UL);
          then:
            - lambda: |-
                float ring3_km = 10.0f;
                const std::string range = id(flight_radar_range).current_option();
                if (range.rfind("5", 0) == 0) ring3_km = 5.0f;
                else if (range.rfind("15", 0) == 0) ring3_km = 15.0f;
                else if (range.rfind("25", 0) == 0) ring3_km = 25.0f;

                const float outer_km = ring3_km * (4.0f / 3.0f);
                const float fetch_km = outer_km * (177.0f / 160.0f);
                const float fetch_nm = fetch_km / 1.852f;

                char url[180];
                snprintf(url, sizeof(url),
                         "https://opendata.adsb.fi/api/v3/lat/%.6f/lon/%.6f/dist/%.1f",
                         id(ha_home_latitude).state,
                         id(ha_home_longitude).state,
                         fetch_nm);

                if (!id(async_radar_http).start(std::string(url))) {
                  id(flight_radar_status).publish_state("error");
                  id(flight_radar_last_error).publish_state("async request rejected");
                  id(flight_radar_breadcrumb).publish_state("request rejected");
                  return;
                }

                id(flight_radar_fetch_in_progress) = true;
                id(flight_radar_last_fetch_ms) = millis();
                id(flight_radar_fetch_started_ms) = id(flight_radar_last_fetch_ms);
                id(flight_radar_breadcrumb).publish_state("fetch queued");
                id(flight_radar_status).publish_state("fetching");
          else:
            - lambda: |-
                if (!id(ha_home_latitude).has_state()
                    || !id(ha_home_longitude).has_state()) {
                  id(flight_radar_status).publish_state("no home location");
                }
  - id: flight_detail_apply_cached
    mode: restart
    then:
      - lambda: |-
          id(flight_detail_route_key) = id(flight_detail_selected_callsign);
          id(flight_detail_route_valid) = false;
          id(flight_detail_airline) = "";
          id(flight_detail_origin_city) = "";
          id(flight_detail_origin_code) = "";
          id(flight_detail_destination_city) = "";
          id(flight_detail_destination_code) = "";

          if (id(flight_detail_selected_callsign).empty()) {
            id(flight_detail_route_status) = "unavailable";
            return;
          }
          const auto *record = id(async_radar_http).find_enrichment(
              id(flight_detail_selected_callsign));
          if (record == nullptr
              || record->status ==
                     esphome::async_flight_radar::EnrichmentStatus::PENDING
              || record->status ==
                     esphome::async_flight_radar::EnrichmentStatus::RETRY) {
            id(flight_detail_route_status) = "loading";
            return;
          }
          if (record->status ==
              esphome::async_flight_radar::EnrichmentStatus::UNAVAILABLE) {
            id(flight_detail_route_status) = "unavailable";
            return;
          }

          id(flight_detail_airline) = record->airline;
          id(flight_detail_origin_city) = record->origin_city;
          id(flight_detail_origin_code) = record->origin_code;
          id(flight_detail_origin_lat) = record->origin_lat;
          id(flight_detail_origin_lon) = record->origin_lon;
          id(flight_detail_destination_city) = record->destination_city;
          id(flight_detail_destination_code) = record->destination_code;
          id(flight_detail_destination_lat) = record->destination_lat;
          id(flight_detail_destination_lon) = record->destination_lon;
          id(flight_detail_route_valid) = record->route_positions_valid;
          id(flight_detail_route_status) = "ready";

  - id: flight_detail_prefetch
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                if (id(async_radar_http).is_enrichment_running()
                    || id(async_radar_http).is_flight_times_running()) return;
                if (!id(ha_home_latitude).has_state()
                    || !id(ha_home_longitude).has_state()) return;

                const std::string &payload = id(flight_radar_aircraft_payload);
                const char *cursor = payload.c_str();
                const char *end = cursor + payload.size();
                std::string best_callsign;
                std::string best_hex;
                float best_distance_squared = INFINITY;

                auto read_field = [&](std::string *destination) -> char {
                  const char *start = cursor;
                  while (cursor < end && *cursor != '|' && *cursor != ';') cursor++;
                  destination->assign(start, cursor - start);
                  const char delimiter = cursor < end ? *cursor : '\0';
                  if (cursor < end) cursor++;
                  return delimiter;
                };
                auto normalize = [](const std::string &input) -> std::string {
                  std::string output;
                  output.reserve(input.size());
                  for (char character : input) {
                    if (character >= 'a' && character <= 'z') character -= 'a' - 'A';
                    if ((character >= 'A' && character <= 'Z')
                        || (character >= '0' && character <= '9')) {
                      output.push_back(character);
                    }
                  }
                  return output;
                };

                while (cursor < end) {
                  std::string fields[16];
                  bool complete = true;
                  for (int index = 0; index < 16; index++) {
                    const char delimiter = read_field(&fields[index]);
                    if (index < 15 && delimiter != '|') {
                      complete = false;
                      break;
                    }
                    if (index == 15 && delimiter != ';' && delimiter != '\0') {
                      complete = false;
                    }
                  }
                  if (!complete) {
                    while (cursor < end && *cursor != ';') cursor++;
                    if (cursor < end) cursor++;
                    continue;
                  }

                  const std::string callsign = normalize(fields[5]);
                  if (callsign.empty()
                      || !id(async_radar_http).needs_enrichment(callsign)) {
                    continue;
                  }

                  const float lat = strtof(fields[0].c_str(), nullptr);
                  const float lon = strtof(fields[1].c_str(), nullptr);
                  const float latitude_scale = cosf(
                      id(ha_home_latitude).state * 0.01745329252f);
                  const float dx = (lon - id(ha_home_longitude).state)
                      * latitude_scale;
                  const float dy = lat - id(ha_home_latitude).state;
                  const float distance_squared = dx * dx + dy * dy;
                  if (distance_squared < best_distance_squared) {
                    best_distance_squared = distance_squared;
                    best_callsign = callsign;
                    best_hex = normalize(fields[8]);
                  }
                }
                if (best_callsign.empty()) return;

                bool valid_hex = best_hex.size() == 6;
                for (const char character : best_hex) {
                  if (!((character >= '0' && character <= '9')
                        || (character >= 'A' && character <= 'F'))) {
                    valid_hex = false;
                  }
                }

                std::string url;
                if (valid_hex) {
                  url = "https://api.adsbdb.com/v0/aircraft/" + best_hex
                      + "?callsign=" + best_callsign;
                } else {
                  url = "https://api.adsbdb.com/v0/callsign/" + best_callsign;
                }
                if (!id(async_radar_http).start_enrichment(
                        url, best_callsign, best_hex)) return;

                id(flight_detail_fetch_in_progress) = true;
                char breadcrumb[64];
                snprintf(breadcrumb, sizeof(breadcrumb), "prefetch %.15s queued",
                         best_callsign.c_str());
                id(flight_radar_breadcrumb).publish_state(breadcrumb);

  - id: flight_times_fetch
    mode: restart
    then:
      - lambda: |-
          auto normalize = [](const std::string &input) -> std::string {
            std::string output;
            output.reserve(input.size());
            for (char character : input) {
              if (character >= 'a' && character <= 'z') character -= 'a' - 'A';
              if ((character >= 'A' && character <= 'Z')
                  || (character >= '0' && character <= '9')) {
                output.push_back(character);
              }
            }
            return output;
          };
          auto publish_status = [&](const char *status) {
            id(flight_times_status) = status;
            id(flight_times_status_sensor).publish_state(status);
          };

          if (!id(flight_detail_active)
              || id(flight_detail_selected_callsign).empty()) {
            publish_status("unavailable");
            return;
          }

          const std::string callsign =
              normalize(id(flight_detail_selected_callsign));
          const std::string aircraft_hex =
              normalize(id(flight_detail_selected_hex));
          const std::string registration =
              normalize(id(flight_detail_selected_registration));
          const std::string request_key =
              aircraft_hex.empty() ? callsign : aircraft_hex;
          const uint32_t now_ms = millis();

          if (id(flight_times_status) == "ready"
              && id(flight_times_cache_key) == request_key
              && now_ms - id(flight_times_cached_at_ms) < 60000UL) {
            publish_status("ready");
            return;
          }

          id(flight_times_cache_key) = "";
          id(flight_times_actual_off_epoch) = 0;
          id(flight_times_estimated_on_epoch) = 0;
          id(flight_times_cached_at_ms) = 0;

          if (!id(device_time).now().is_valid()) {
            publish_status("clock_wait");
            id(flight_radar_breadcrumb).publish_state("AeroAPI waiting for clock");
            return;
          }
          if (id(async_radar_http).is_flight_times_running()) {
            publish_status("busy");
            id(flight_radar_breadcrumb).publish_state("AeroAPI request already running");
            return;
          }
          if (id(flight_times_last_request_ms) != 0
              && now_ms - id(flight_times_last_request_ms) < 7000UL) {
            publish_status("rate_limited");
            id(flight_radar_breadcrumb).publish_state("AeroAPI tap rate limited");
            return;
          }

          const auto now = id(device_time).now();
          time_t start_epoch = now.timestamp - 24 * 60 * 60;
          time_t end_epoch = now.timestamp + 6 * 60 * 60;
          struct tm start_tm {};
          struct tm end_tm {};
          gmtime_r(&start_epoch, &start_tm);
          gmtime_r(&end_epoch, &end_tm);
          char start_time[24];
          char end_time[24];
          strftime(start_time, sizeof(start_time), "%Y-%m-%dT%H:%M:%SZ", &start_tm);
          strftime(end_time, sizeof(end_time), "%Y-%m-%dT%H:%M:%SZ", &end_tm);

          char url[256];
          snprintf(url, sizeof(url),
                   "https://aeroapi.flightaware.com/aeroapi/flights/%s"
                   "?start=%s&end=%s&max_pages=1",
                   callsign.c_str(), start_time, end_time);
          if (!id(async_radar_http).start_flight_times(
                  std::string(url), callsign, aircraft_hex, registration)) {
            publish_status("request_rejected");
            id(flight_radar_breadcrumb).publish_state("AeroAPI request rejected");
            return;
          }

          id(flight_times_last_request_ms) = now_ms;
          publish_status("loading");
          char breadcrumb[64];
          snprintf(breadcrumb, sizeof(breadcrumb), "AeroAPI %.15s queued",
                   callsign.c_str());
          id(flight_radar_breadcrumb).publish_state(breadcrumb);

  - id: pulse_touch_input
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: touch_input
          state: true
      - delay: 150ms
      - binary_sensor.template.publish:
          id: touch_input
          state: false

  - id: pulse_swipe_left
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: swipe_left
          state: true
      - delay: 150ms
      - binary_sensor.template.publish:
          id: swipe_left
          state: false

  - id: pulse_swipe_right
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: swipe_right
          state: true
      - delay: 150ms
      - binary_sensor.template.publish:
          id: swipe_right
          state: false

  - id: pulse_swipe_up
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: swipe_up
          state: true
      - delay: 150ms
      - binary_sensor.template.publish:
          id: swipe_up
          state: false

  - id: pulse_swipe_down
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: swipe_down
          state: true
      - delay: 150ms
      - binary_sensor.template.publish:
          id: swipe_down
          state: false

i2c:
  - id: bus_a
    scl: GPIO1
    sda: GPIO2
    frequency: 100kHz
    scan: true

touchscreen:
  - platform: cst816
    id: screen_touch
    interrupt_pin: GPIO10
    display: main_display
    i2c_id: bus_a
    on_touch:
      - lambda: |-
          id(touch_active) = true;
          id(touch_start_x) = touch.x;
          id(touch_start_y) = touch.y;
          id(touch_last_x) = touch.x;
          id(touch_last_y) = touch.y;
          id(touch_start_ms) = millis();
          if (id(flight_detail_active)) {
            id(flight_detail_last_interaction_ms) = millis();
          }
    on_update:
      - lambda: |-
          if (!id(touch_active)) return;
          for (auto &point : touches) {
            if (point.state >= 1 && point.state <= 2) {
              id(touch_last_x) = point.x;
              id(touch_last_y) = point.y;
              break;
            }
          }
    on_release:
      - lambda: |-
          if (!id(touch_active)) return;
          id(touch_active) = false;

          int dx = id(touch_last_x) - id(touch_start_x);
          int dy = id(touch_last_y) - id(touch_start_y);
          const uint32_t elapsed = millis() - id(touch_start_ms);
          const int min_dim = std::min(id(main_display).get_width(), id(main_display).get_height());
          const int swipe_distance = std::max(16, min_dim / 8);
          const int tap_distance = std::max(14, min_dim / 12);

          switch (${rotate_display}) {
            case 90: {
              const int old_dx = dx;
              dx = dy;
              dy = -old_dx;
              break;
            }
            case 180:
              dx = -dx;
              dy = -dy;
              break;
            case 270: {
              const int old_dx = dx;
              dx = -dy;
              dy = old_dx;
              break;
            }
            default:
              break;
          }

          const int abs_x = std::abs(dx);
          const int abs_y = std::abs(dy);
          if (elapsed <= 1500UL && (abs_x >= swipe_distance || abs_y >= swipe_distance)) {
            if (abs_x >= abs_y) {
              if (dx < 0) id(pulse_swipe_left).execute();
              else id(pulse_swipe_right).execute();
            } else {
              if (dy < 0) id(pulse_swipe_up).execute();
              else id(pulse_swipe_down).execute();
            }
          } else if (elapsed <= 700UL && abs_x <= tap_distance && abs_y <= tap_distance) {
            id(pulse_touch_input).execute();

            if (id(flight_detail_active)) {
              id(flight_detail_active) = false;
              id(flight_radar_hit_count) = 0;
              return;
            }

            const int tap_x = id(touch_last_x);
            const int tap_y = id(touch_last_y);
            const int hit_radius = 28;
            int best_hit = -1;
            int best_label_distance_squared = 0x7FFFFFFF;
            constexpr int LABEL_TOUCH_PADDING = 4;
            for (int index = 0; index < id(flight_radar_hit_count); index++) {
              const int raw_x0 = id(flight_radar_hit_label_x0)[index];
              const int raw_y0 = id(flight_radar_hit_label_y0)[index];
              const int raw_x1 = id(flight_radar_hit_label_x1)[index];
              const int raw_y1 = id(flight_radar_hit_label_y1)[index];
              if (raw_x1 <= raw_x0 || raw_y1 <= raw_y0) continue;
              const int x0 = raw_x0 - LABEL_TOUCH_PADDING;
              const int y0 = raw_y0 - LABEL_TOUCH_PADDING;
              const int x1 = raw_x1 + LABEL_TOUCH_PADDING;
              const int y1 = raw_y1 + LABEL_TOUCH_PADDING;
              if (tap_x < x0 || tap_x >= x1
                  || tap_y < y0 || tap_y >= y1) {
                continue;
              }
              const int center_dx = tap_x - (x0 + x1) / 2;
              const int center_dy = tap_y - (y0 + y1) / 2;
              const int distance_squared =
                  center_dx * center_dx + center_dy * center_dy;
              if (distance_squared < best_label_distance_squared) {
                best_hit = index;
                best_label_distance_squared = distance_squared;
              }
            }

            if (best_hit < 0) {
              int best_plane_distance_squared = hit_radius * hit_radius + 1;
              for (int index = 0; index < id(flight_radar_hit_count); index++) {
                const int hit_dx = tap_x - id(flight_radar_hit_x)[index];
                const int hit_dy = tap_y - id(flight_radar_hit_y)[index];
                const int distance_squared = hit_dx * hit_dx + hit_dy * hit_dy;
                if (distance_squared < best_plane_distance_squared) {
                  best_hit = index;
                  best_plane_distance_squared = distance_squared;
                }
              }
            }
            if (best_hit < 0) return;
            if (id(flight_radar_hit_generation)
                != id(flight_radar_payload_generation)) return;

            const int target_plane =
                id(flight_radar_hit_plane_index)[best_hit];
            const std::string &payload = id(flight_radar_aircraft_payload);
            const char *cursor = payload.c_str();
            const char *end = cursor + payload.size();
            for (int index = 0; index < target_plane && cursor < end; index++) {
              while (cursor < end && *cursor != ';') cursor++;
              if (cursor < end) cursor++;
            }
            if (cursor >= end) return;

            auto read_field = [&]() -> std::string {
              const char *start = cursor;
              while (cursor < end && *cursor != '|' && *cursor != ';') cursor++;
              std::string value(start, cursor - start);
              if (cursor < end) cursor++;
              return value;
            };

            const std::string latitude = read_field();
            const std::string longitude = read_field();
            read_field();
            read_field();
            const std::string ground_speed = read_field();
            const std::string callsign = read_field();
            const std::string type = read_field();
            const std::string altitude = read_field();
            const std::string hex = read_field();
            const std::string description = read_field();
            const std::string registration = read_field();
            if (hex.empty()) return;

            id(flight_detail_selected_lat) = strtof(latitude.c_str(), nullptr);
            id(flight_detail_selected_lon) = strtof(longitude.c_str(), nullptr);
            id(flight_detail_selected_ground_speed) =
                strtof(ground_speed.c_str(), nullptr);
            id(flight_detail_selected_callsign) = callsign;
            id(flight_detail_selected_type) = type;
            id(flight_detail_selected_altitude) = altitude;
            id(flight_detail_selected_hex) = hex;
            id(flight_detail_selected_description) = description;
            id(flight_detail_selected_registration) = registration;
            id(flight_detail_active) = true;
            id(flight_detail_last_interaction_ms) = millis();
            id(flight_radar_hit_count) = 0;
            id(flight_detail_apply_cached).execute();
            id(flight_detail_prefetch).execute();
            id(flight_times_fetch).execute();
          }

esp32_touch:
  setup_mode: false
  measurement_duration: 0.25ms
  sleep_duration: 0.5ms

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO18
  data_pins: [GPIO46, GPIO13, GPIO11, GPIO12]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    cs_pin: GPIO14
    reset_pin: GPIO3
    data_rate: 40MHz
    color_order: rgb
    rotation: ${rotate_display}
    update_interval: 100ms
    auto_clear_enabled: false
    dimensions:
      height: ${imageheight}
      width: ${imagewidth}
    pages:
      - id: flight_radar_page
        lambda: |-
          const int W = it.get_width();
          const int H = it.get_height();
          const int MIN_WH = std::min(W, H);
          const int CX = W / 2;
          const int CY = H / 2;
          const int R = MIN_WH / 2 - 20;
          const int EDGE_R = MIN_WH / 2 - 3;

          const Color BG(4, 10, 28);
          const Color GRID(16, 100, 32);
          const Color LABEL(255, 255, 255);
          const Color AIRCRAFT(255, 210, 32);
          const Color TYPE_COLOR(255, 200, 0);
          const Color ALTITUDE_COLOR(90, 200, 255);
          const Color RUNWAY(56, 150, 170);
          const Color RUNWAY_LABEL(110, 210, 230);

          const uint32_t frame_start_ms = millis();
          id(flight_radar_frame_started_ms) = frame_start_ms;
          struct RadarDirtyRect {
            int x0;
            int y0;
            int x1;
            int y1;
          };
          static RadarDirtyRect previous_dirty[96];
          static int previous_dirty_count = 0;
          static bool radar_base_initialized = false;
          static bool radar_last_show_map = false;
          static bool radar_last_has_home = false;
          static bool radar_last_show_runways = false;
          static std::string radar_last_range;
          const bool publish_frame_diag =
              id(flight_radar_frame_last_diag_ms) == 0
              || frame_start_ms - id(flight_radar_frame_last_diag_ms) >= 10000UL;
          if (publish_frame_diag) {
            id(flight_radar_breadcrumb).publish_state("draw start");
          }

          if (id(flight_detail_active)
              && frame_start_ms - id(flight_detail_last_interaction_ms)
                     >= 60000UL) {
            id(flight_detail_active) = false;
            id(flight_radar_hit_count) = 0;
          }

          if (id(flight_detail_active)) {
            it.fill(BG);
            radar_base_initialized = false;
            previous_dirty_count = 0;
            id(flight_radar_hit_count) = 0;

            const Color MUTED(90, 150, 165);
            const Color ACCENT(90, 220, 255);
            const Color ROUTE(80, 220, 130);
            const Color DIVIDER(20, 85, 70);

            const std::string display_callsign =
                id(flight_detail_selected_callsign).empty()
                    ? id(flight_detail_selected_hex)
                    : id(flight_detail_selected_callsign);
            it.printf(CX, 10, id(font_radar_large), AIRCRAFT,
                      TextAlign::TOP_CENTER, "%s", display_callsign.c_str());

            std::string airline = id(flight_detail_airline);
            if (id(flight_detail_route_status) == "loading") {
              airline = "LOOKING UP FLIGHT";
            } else if (airline.empty()) {
              airline = "AIRLINE UNAVAILABLE";
            }
            it.printf(CX, 39, id(font_radar_small), ACCENT,
                      TextAlign::TOP_CENTER, "%s", airline.c_str());
            it.line(48, 63, W - 48, 63, DIVIDER);

            if (id(flight_detail_route_status) == "ready") {
              std::string origin = id(flight_detail_origin_city);
              std::string destination = id(flight_detail_destination_city);
              if (!id(flight_detail_origin_code).empty()) {
                origin += "  " + id(flight_detail_origin_code);
              }
              if (!id(flight_detail_destination_code).empty()) {
                destination += "  " + id(flight_detail_destination_code);
              }
              it.printf(CX, 73, id(font_detail_value), LABEL,
                        TextAlign::TOP_CENTER, "%s", origin.c_str());
              it.printf(CX, 100, id(font_radar_small), ROUTE,
                        TextAlign::TOP_CENTER, "TO");
              it.printf(CX, 119, id(font_detail_value), LABEL,
                        TextAlign::TOP_CENTER, "%s", destination.c_str());
            } else if (id(flight_detail_route_status) == "loading") {
              it.printf(CX, 94, id(font_detail_value), MUTED,
                        TextAlign::TOP_CENTER, "ROUTE LOADING");
            } else {
              it.printf(CX, 94, id(font_detail_value), MUTED,
                        TextAlign::TOP_CENTER, "ROUTE UNAVAILABLE");
            }
            it.line(35, 151, W - 35, 151, DIVIDER);

            char departed[24] = "--:--";
            char arriving[24] = "--:--";
            bool has_estimate = false;
            bool has_api_times = false;

            auto normalize_key = [](const std::string &input) -> std::string {
              std::string output;
              output.reserve(input.size());
              for (char character : input) {
                if (character >= 'a' && character <= 'z') character -= 'a' - 'A';
                if ((character >= 'A' && character <= 'Z')
                    || (character >= '0' && character <= '9')) {
                  output.push_back(character);
                }
              }
              return output;
            };
            const std::string selected_times_key =
                id(flight_detail_selected_hex).empty()
                    ? normalize_key(id(flight_detail_selected_callsign))
                    : normalize_key(id(flight_detail_selected_hex));
            const auto current_time = id(device_time).now();
            if (id(flight_times_status) == "ready"
                && id(flight_times_cache_key) == selected_times_key
                && id(flight_times_actual_off_epoch) > 0
                && id(flight_times_estimated_on_epoch) > 0
                && current_time.is_valid()) {
              auto format_api_duration = [](int64_t seconds, const char *suffix,
                                            char *output, size_t output_length) {
                const int64_t nonnegative_seconds = std::max<int64_t>(0, seconds);
                int total_minutes = static_cast<int>((nonnegative_seconds + 30) / 60);
                total_minutes = std::min(total_minutes, 99 * 60 + 59);
                snprintf(output, output_length, "%02d:%02d%s",
                         total_minutes / 60, total_minutes % 60, suffix);
              };
              const int64_t now_epoch = static_cast<int64_t>(current_time.timestamp);
              format_api_duration(
                  now_epoch - id(flight_times_actual_off_epoch), " AGO",
                  departed, sizeof(departed));
              format_api_duration(
                  id(flight_times_estimated_on_epoch) - now_epoch, "",
                  arriving, sizeof(arriving));
              has_api_times = true;
            }

            if (!has_api_times && id(flight_detail_route_valid)
                && id(flight_detail_selected_ground_speed) >= 60.0f) {
              constexpr float DEG_TO_RAD_DETAIL = 0.01745329252f;
              constexpr float EARTH_RADIUS_NM = 3440.065f;
              auto distance_nm = [&](float lat1, float lon1,
                                     float lat2, float lon2) -> float {
                const float dlat = (lat2 - lat1) * DEG_TO_RAD_DETAIL;
                const float dlon = (lon2 - lon1) * DEG_TO_RAD_DETAIL;
                const float lat1_rad = lat1 * DEG_TO_RAD_DETAIL;
                const float lat2_rad = lat2 * DEG_TO_RAD_DETAIL;
                const float a = sinf(dlat * 0.5f) * sinf(dlat * 0.5f)
                    + cosf(lat1_rad) * cosf(lat2_rad)
                        * sinf(dlon * 0.5f) * sinf(dlon * 0.5f);
                return EARTH_RADIUS_NM
                    * 2.0f * atan2f(sqrtf(a), sqrtf(std::max(0.0f, 1.0f - a)));
              };
              auto format_duration = [](float minutes, const char *suffix,
                                        char *output, size_t output_length) {
                int total_minutes = (int) lroundf(std::max(0.0f, minutes));
                total_minutes = std::min(total_minutes, 99 * 60 + 59);
                snprintf(output, output_length, "~%02d:%02d%s",
                         total_minutes / 60, total_minutes % 60, suffix);
              };

              const float speed = id(flight_detail_selected_ground_speed);
              const float travelled_nm = distance_nm(
                  id(flight_detail_origin_lat), id(flight_detail_origin_lon),
                  id(flight_detail_selected_lat), id(flight_detail_selected_lon));
              const float remaining_nm = distance_nm(
                  id(flight_detail_selected_lat), id(flight_detail_selected_lon),
                  id(flight_detail_destination_lat),
                  id(flight_detail_destination_lon));
              format_duration(travelled_nm * 60.0f / speed, " AGO",
                              departed, sizeof(departed));
              format_duration(remaining_nm * 60.0f / speed, "",
                              arriving, sizeof(arriving));
              has_estimate = true;
            }

            it.printf(88, 160, id(font_radar_small), MUTED,
                      TextAlign::TOP_CENTER, "DEPARTED");
            it.printf(W - 88, 160, id(font_radar_small), MUTED,
                      TextAlign::TOP_CENTER, "ARRIVING IN");
            it.printf(88, 180, id(font_detail_value), ROUTE,
                      TextAlign::TOP_CENTER, "%s", departed);
            it.printf(W - 88, 180, id(font_detail_value), ROUTE,
                      TextAlign::TOP_CENTER, "%s", arriving);
            it.line(35, 207, W - 35, 207, DIVIDER);

            std::string aircraft_type = id(flight_detail_selected_type);
            if (aircraft_type.empty()) aircraft_type = "UNKNOWN";
            it.printf(CX, 215, id(font_radar_small), MUTED,
                      TextAlign::TOP_CENTER, "AIRCRAFT");
            it.printf(CX, 233, id(font_detail_value), TYPE_COLOR,
                      TextAlign::TOP_CENTER, "%s", aircraft_type.c_str());
            if (!id(flight_detail_selected_description).empty()) {
              it.printf(CX, 256, id(font_radar_small), LABEL,
                        TextAlign::TOP_CENTER, "%s",
                        id(flight_detail_selected_description).c_str());
            }

            std::string altitude = id(flight_detail_selected_altitude);
            if (altitude.empty()) altitude = "--";
            char speed[16] = "--";
            if (id(flight_detail_selected_ground_speed) > 0.0f) {
              snprintf(speed, sizeof(speed), "%d kt",
                       (int) lroundf(id(flight_detail_selected_ground_speed)));
            }
            it.printf(112, 279, id(font_radar_small), MUTED,
                      TextAlign::TOP_CENTER, "ALTITUDE");
            it.printf(W - 112, 279, id(font_radar_small), MUTED,
                      TextAlign::TOP_CENTER, "SPEED");
            it.printf(112, 299, id(font_detail_value), ALTITUDE_COLOR,
                      TextAlign::TOP_CENTER, "%s", altitude.c_str());
            it.printf(W - 112, 299, id(font_detail_value), ALTITUDE_COLOR,
                      TextAlign::TOP_CENTER, "%s", speed);
            if (has_estimate) {
              it.printf(CX, H - 9, id(font_radar_small), MUTED,
                        TextAlign::BOTTOM_CENTER, "ESTIMATED");
            }

            id(flight_radar_frame_duration_ms) = millis() - frame_start_ms;
            if (id(flight_radar_frame_duration_ms)
                > id(flight_radar_frame_max_duration_ms)) {
              id(flight_radar_frame_max_duration_ms) =
                  id(flight_radar_frame_duration_ms);
            }
            id(flight_radar_frame_planes) = 0;
            id(flight_radar_frame_labels) = 0;
            id(flight_radar_frame_degraded_labels) = 0;
            id(flight_radar_frame_skipped_labels) = 0;
            if (publish_frame_diag) {
              id(flight_radar_frame_last_diag_ms) = millis();
              id(flight_radar_display_duration_ms_sensor).publish_state(
                  id(flight_radar_frame_duration_ms));
              char breadcrumb[64];
              snprintf(breadcrumb, sizeof(breadcrumb),
                       "detail draw ok %ums %s",
                       (unsigned) id(flight_radar_frame_duration_ms),
                       id(flight_detail_route_status).c_str());
              id(flight_radar_breadcrumb).publish_state(breadcrumb);
            }
            return;
          }

          id(flight_radar_hit_count) = 0;
          float ring3_km = 10.0f;
          const std::string range = id(flight_radar_range).current_option();
          if (range.rfind("5", 0) == 0) ring3_km = 5.0f;
          else if (range.rfind("15", 0) == 0) ring3_km = 15.0f;
          else if (range.rfind("25", 0) == 0) ring3_km = 25.0f;
          const float outer_km = ring3_km * (4.0f / 3.0f);
          const float fetch_km = outer_km * ((float) EDGE_R / (float) R);
          const float px_per_km = (float) R / outer_km;

          const bool has_home = id(ha_home_latitude).has_state()
              && id(ha_home_longitude).has_state();
          const float home_lat = has_home ? id(ha_home_latitude).state : 0.0f;
          const float home_lon = has_home ? id(ha_home_longitude).state : 0.0f;
          constexpr float MAP_HOME_LAT =
              echoear_flight_radar_map::CENTER_LATITUDE;
          constexpr float MAP_HOME_LON =
              echoear_flight_radar_map::CENTER_LONGITUDE;
          image::Image *active_map = nullptr;
          if (range.rfind("5", 0) == 0) {
            active_map = id(flight_radar_map_5km);
          } else if (range.rfind("10", 0) == 0) {
            active_map = id(flight_radar_map_10km);
          } else if (range.rfind("15", 0) == 0) {
            active_map = id(flight_radar_map_15km);
          } else if (range.rfind("25", 0) == 0) {
            active_map = id(flight_radar_map_25km);
          }
          const bool show_map = has_home
              && active_map != nullptr
              && fabsf(home_lat - MAP_HOME_LAT) < 0.002f
              && fabsf(home_lon - MAP_HOME_LON) < 0.002f;
          const bool show_runways = id(flight_radar_show_runways).state;

          RadarDirtyRect next_dirty[96];
          int next_dirty_count = 0;
          auto mark_dirty = [&](int x0, int y0, int x1, int y1) {
            x0 = std::max(0, std::min(W, x0));
            y0 = std::max(0, std::min(H, y0));
            x1 = std::max(0, std::min(W, x1));
            y1 = std::max(0, std::min(H, y1));
            if (x1 <= x0 || y1 <= y0) return;

            for (int index = 0; index < next_dirty_count; index++) {
              RadarDirtyRect &existing = next_dirty[index];
              if (x1 + 2 < existing.x0 || existing.x1 + 2 < x0
                  || y1 + 2 < existing.y0 || existing.y1 + 2 < y0) {
                continue;
              }
              existing.x0 = std::min(existing.x0, x0);
              existing.y0 = std::min(existing.y0, y0);
              existing.x1 = std::max(existing.x1, x1);
              existing.y1 = std::max(existing.y1, y1);
              return;
            }
            if (next_dirty_count < 96) {
              next_dirty[next_dirty_count++] = {x0, y0, x1, y1};
            }
          };
          auto commit_dirty = [&]() {
            previous_dirty_count = next_dirty_count;
            for (int index = 0; index < next_dirty_count; index++) {
              previous_dirty[index] = next_dirty[index];
            }
          };

          const bool rebuild_radar_base = !radar_base_initialized
              || radar_last_show_map != show_map
              || radar_last_has_home != has_home
              || radar_last_show_runways != show_runways
              || radar_last_range != range;
          if (rebuild_radar_base) {
            it.fill(BG);
            if (show_map) it.image(0, 0, active_map);
            previous_dirty_count = 0;
            radar_base_initialized = true;
            radar_last_show_map = show_map;
            radar_last_has_home = has_home;
            radar_last_show_runways = show_runways;
            radar_last_range = range;
          } else {
            for (int index = 0; index < previous_dirty_count; index++) {
              const RadarDirtyRect &rectangle = previous_dirty[index];
              if (!show_map) {
                it.filled_rectangle(rectangle.x0, rectangle.y0,
                                    rectangle.x1 - rectangle.x0,
                                    rectangle.y1 - rectangle.y0, BG);
                continue;
              }
              for (int y = rectangle.y0; y < rectangle.y1; y++) {
                for (int x = rectangle.x0; x < rectangle.x1; x++) {
                  it.draw_pixel_at(x, y,
                                   active_map->get_pixel(x, y));
                }
              }
            }
          }

          char scale_label[20];
          if (id(flight_radar_units).current_option() == "mi") {
            snprintf(scale_label, sizeof(scale_label), "%dmi",
                     (int) lroundf(ring3_km / 1.609344f));
          } else {
            snprintf(scale_label, sizeof(scale_label), "%dkm",
                     (int) lroundf(ring3_km));
          }

          for (int ring = 1; ring <= 4; ring++) {
            const int radius = (R * ring) / 4;
            it.circle(CX, CY, radius, GRID);
            it.circle(CX, CY, radius - 1, GRID);
          }
          it.line(CX, CY - R, CX, CY + R, GRID);
          it.line(CX - R, CY, CX + R, CY, GRID);
          it.filled_circle(CX, CY, 3, LABEL);

          it.printf(CX, 3, id(font_radar_small), LABEL, TextAlign::TOP_CENTER, "N");
          it.printf(CX, H - 3, id(font_radar_small), LABEL, TextAlign::BOTTOM_CENTER, "S");
          it.printf(3, CY, id(font_radar_small), LABEL, TextAlign::CENTER_LEFT, "W");
          it.printf(W - 3, CY, id(font_radar_small), LABEL, TextAlign::CENTER_RIGHT, "E");
          it.filled_rectangle(CX + R - 45, CY - 10, 39, 20, BG);
          it.printf(CX + R - 9, CY, id(font_radar_small), GRID,
                    TextAlign::CENTER_RIGHT, "%s", scale_label);

          if (!has_home) {
            it.printf(CX, CY - 12, id(font_radar_large), LABEL,
                      TextAlign::CENTER, "NO HOME");
            it.printf(CX, CY + 16, id(font_radar_small), LABEL,
                      TextAlign::CENTER, "zone.home unavailable");
            mark_dirty(CX - 125, CY - 40, CX + 125, CY + 42);
            commit_dirty();
            return;
          }

          const float DEG_TO_RAD = 0.01745329252f;
          const float KM_PER_DEG_LAT = 110.574f;
          const float KM_PER_DEG_LON =
              std::max(1.0f, 111.320f * cosf(home_lat * DEG_TO_RAD));

          auto offset_km = [&](float lat, float lon, float &dx, float &dy,
                               float &distance) {
            dx = (lon - home_lon) * KM_PER_DEG_LON;
            dy = (lat - home_lat) * KM_PER_DEG_LAT;
            distance = sqrtf(dx * dx + dy * dy);
          };

          auto project = [&](float lat, float lon, int &x, int &y,
                             float &distance) {
            float dx = 0.0f;
            float dy = 0.0f;
            offset_km(lat, lon, dx, dy, distance);
            x = CX + (int) lroundf(dx * px_per_km);
            y = CY - (int) lroundf(dy * px_per_km);
          };

          auto thick_line = [&](int x0, int y0, int x1, int y1, Color color) {
            it.line(x0, y0, x1, y1, color);
            if (abs(x1 - x0) > abs(y1 - y0)) {
              it.line(x0, y0 + 1, x1, y1 + 1, color);
            } else {
              it.line(x0 + 1, y0, x1 + 1, y1, color);
            }
          };

          struct RunwayDef {
            const char *ident;
            float airport_lat;
            float airport_lon;
            float low_end_lat;
            float low_end_lon;
            float high_end_lat;
            float high_end_lon;
          };

          static const RunwayDef RUNWAYS[] = {
            {"EGLL", 51.470020f, -0.454295f, 51.477490f, -0.489439f,
             51.477681f, -0.433227f},
            {"EGLL", 51.470020f, -0.454295f, 51.464780f, -0.486808f,
             51.464957f, -0.434048f},
          };

          int visible_runways = 0;
          if (show_runways) {
            const int runway_count = sizeof(RUNWAYS) / sizeof(RUNWAYS[0]);
            const char *last_label = "";
            for (int index = 0; index < runway_count; index++) {
              float airport_dx = 0.0f;
              float airport_dy = 0.0f;
              float airport_distance = 0.0f;
              offset_km(RUNWAYS[index].airport_lat,
                        RUNWAYS[index].airport_lon,
                        airport_dx, airport_dy, airport_distance);
              if (airport_distance > fetch_km) continue;

              int x0 = 0;
              int y0 = 0;
              int x1 = 0;
              int y1 = 0;
              float distance0 = 0.0f;
              float distance1 = 0.0f;
              project(RUNWAYS[index].low_end_lat,
                      RUNWAYS[index].low_end_lon,
                      x0, y0, distance0);
              project(RUNWAYS[index].high_end_lat,
                      RUNWAYS[index].high_end_lon,
                      x1, y1, distance1);
              thick_line(x0, y0, x1, y1, RUNWAY);
              visible_runways++;

              if (strcmp(last_label, RUNWAYS[index].ident) != 0) {
                int label_x = 0;
                int label_y = 0;
                float label_distance = 0.0f;
                project(RUNWAYS[index].airport_lat,
                        RUNWAYS[index].airport_lon,
                        label_x, label_y, label_distance);
                if (label_distance > outer_km) {
                  const float scale =
                      (float) R / std::max(0.1f, label_distance * px_per_km);
                  label_x = CX + (int) lroundf((label_x - CX) * scale);
                  label_y = CY + (int) lroundf((label_y - CY) * scale);
                }
                it.filled_rectangle(label_x - 20, label_y - 19, 40, 17, BG);
                it.printf(label_x, label_y - 2, id(font_radar_small),
                          RUNWAY_LABEL, TextAlign::BOTTOM_CENTER, "%s",
                          RUNWAYS[index].ident);
                last_label = RUNWAYS[index].ident;
              }
            }
          }
          if (visible_runways != id(flight_radar_last_runway_count)) {
            id(flight_radar_last_runway_count) = visible_runways;
            id(flight_radar_runway_count).publish_state(visible_runways);
          }

          struct Plane {
            float lat;
            float lon;
            float predicted_lat;
            float predicted_lon;
            float nose;
            float track;
            float ground_speed;
            float position_age;
            bool position_mlat;
            int nic;
            int rc;
            char callsign[12];
            char type[8];
            char altitude[18];
            char hex[10];
            char description[36];
            char registration[16];
            char source_type[14];
          };
          struct TrackState {
            bool used;
            bool motion_valid;
            char key[12];
            float anchor_lat;
            float anchor_lon;
            float nose;
            float track;
            float ground_speed;
            uint32_t anchor_ms;
            uint32_t last_payload_ms;
            float last_raw_lat;
            float last_raw_lon;
            uint32_t last_observation_ms;
            bool candidate_valid;
            uint8_t candidate_count;
            float candidate_lat;
            float candidate_lon;
            float candidate_raw_lat;
            float candidate_raw_lon;
            float candidate_nose;
            float candidate_track;
            float candidate_ground_speed;
            uint32_t candidate_ms;
            uint32_t candidate_observation_ms;
            uint32_t candidate_first_ms;
          };
          struct LabelMetrics {
            int callsign_width;
            int type_width;
            int altitude_width;
            int line_height;
          };

          static Plane planes[48];
          static TrackState tracks[48];
          static LabelMetrics label_metrics[48];
          static uint32_t label_metrics_generation = UINT32_MAX;
          static uint32_t tracker_generation = UINT32_MAX;
          int plane_count = 0;
          const bool has_data = id(flight_radar_last_success_ms) != 0;
          const uint32_t age_ms =
              has_data ? millis() - id(flight_radar_last_success_ms) : 0UL;
          const uint32_t age_seconds = age_ms / 1000UL;
          const bool new_payload =
              tracker_generation != id(flight_radar_payload_generation);
          constexpr float MAX_SOURCE_AGE_SECONDS = 12.0f;
          constexpr float MAX_EXTRAPOLATION_SECONDS = 12.0f;

          const std::string &payload = id(flight_radar_aircraft_payload);
          const char *cursor = payload.c_str();
          const char *end = cursor + payload.size();

          auto read_field = [&](char *destination, size_t destination_length) -> char {
            size_t length = 0;
            while (cursor < end && *cursor != '|' && *cursor != ';') {
              if (length + 1 < destination_length) {
                destination[length++] = *cursor;
              }
              cursor++;
            }
            if (destination_length > 0) destination[length] = '\0';
            const char delimiter = cursor < end ? *cursor : '\0';
            if (cursor < end) cursor++;
            return delimiter;
          };

          auto skip_record = [&]() {
            while (cursor < end && *cursor != ';') cursor++;
            if (cursor < end) cursor++;
          };

          auto project_motion = [&](float lat, float lon, float track,
                                    float ground_speed, float seconds,
                                    float &projected_lat,
                                    float &projected_lon) {
            projected_lat = lat;
            projected_lon = lon;
            if (ground_speed <= 0.0f || seconds <= 0.0f) return;
            const float movement_km =
                ground_speed * 1.852f * (seconds / 3600.0f);
            const float track_radians = track * DEG_TO_RAD;
            projected_lat +=
                (cosf(track_radians) * movement_km) / KM_PER_DEG_LAT;
            projected_lon +=
                (sinf(track_radians) * movement_km) / KM_PER_DEG_LON;
          };
          auto position_distance_m = [&](float lat_a, float lon_a,
                                         float lat_b, float lon_b) {
            const float dx = (lon_b - lon_a) * KM_PER_DEG_LON;
            const float dy = (lat_b - lat_a) * KM_PER_DEG_LAT;
            return sqrtf(dx * dx + dy * dy) * 1000.0f;
          };

          while (cursor < end && plane_count < 48) {
            char field[32];
            Plane &plane = planes[plane_count];

            char delimiter = read_field(field, sizeof(field));
            if (field[0] == '\0' && delimiter == '\0') break;
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.lat = strtof(field, nullptr);

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.lon = strtof(field, nullptr);

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.nose = strtof(field, nullptr);

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.track = strtof(field, nullptr);

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.ground_speed = strtof(field, nullptr);

            delimiter = read_field(plane.callsign, sizeof(plane.callsign));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(plane.type, sizeof(plane.type));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(plane.altitude, sizeof(plane.altitude));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(plane.hex, sizeof(plane.hex));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(plane.description, sizeof(plane.description));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(plane.registration, sizeof(plane.registration));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.position_age = strtof(field, nullptr);

            delimiter = read_field(plane.source_type,
                                   sizeof(plane.source_type));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.position_mlat = strtol(field, nullptr, 10) != 0;

            delimiter = read_field(field, sizeof(field));
            if (delimiter != '|') {
              if (delimiter == '\0') break;
              continue;
            }
            plane.nic = (int) strtol(field, nullptr, 10);

            delimiter = read_field(field, sizeof(field));
            plane.rc = (int) strtol(field, nullptr, 10);
            if (delimiter != ';' && delimiter != '\0') skip_record();
            if (plane.callsign[0] == '\0') {
              strncpy(plane.callsign, plane.hex, sizeof(plane.callsign) - 1);
              plane.callsign[sizeof(plane.callsign) - 1] = '\0';
            }

            const char *track_key =
                plane.hex[0] != '\0' ? plane.hex : plane.callsign;
            int track_index = -1;
            int free_track_index = -1;
            int oldest_track_index = 0;
            uint32_t oldest_track_age = 0;
            for (int index = 0; index < 48; index++) {
              TrackState &candidate = tracks[index];
              if (candidate.used && strcmp(candidate.key, track_key) == 0) {
                track_index = index;
                break;
              }
              if (!candidate.used && free_track_index < 0) {
                free_track_index = index;
              }
              if (candidate.used) {
                const uint32_t candidate_age =
                    frame_start_ms - candidate.last_payload_ms;
                if (candidate_age >= oldest_track_age) {
                  oldest_track_age = candidate_age;
                  oldest_track_index = index;
                }
              }
            }
            if (track_index < 0) {
              track_index = free_track_index >= 0
                  ? free_track_index : oldest_track_index;
              tracks[track_index] = {};
              TrackState &new_track = tracks[track_index];
              new_track.used = true;
              strncpy(new_track.key, track_key, sizeof(new_track.key) - 1);
              new_track.key[sizeof(new_track.key) - 1] = '\0';
            }

            TrackState &state = tracks[track_index];
            if (new_payload) {
              state.last_payload_ms = frame_start_ms;
              const float handoff_seconds =
                  (float) (frame_start_ms - id(flight_radar_last_success_ms))
                  / 1000.0f;
              const float measurement_age =
                  std::max(0.0f, plane.position_age + handoff_seconds);
              const uint32_t measurement_age_ms = (uint32_t) std::min(
                  120000.0f, measurement_age * 1000.0f);
              const uint32_t observation_ms =
                  frame_start_ms - measurement_age_ms;
              const bool stale_measurement =
                  measurement_age > MAX_SOURCE_AGE_SECONDS;
              const bool observation_advanced =
                  state.anchor_ms == 0
                  || (int32_t) (observation_ms - state.last_observation_ms) > 500;
              const bool repeated_position =
                  state.anchor_ms != 0
                  && (!observation_advanced
                      || (fabsf(plane.lat - state.last_raw_lat) < 0.000002f
                          && fabsf(plane.lon - state.last_raw_lon) < 0.000002f));

              if (state.anchor_ms == 0) {
                state.anchor_lat = plane.lat;
                state.anchor_lon = plane.lon;
                state.nose = plane.nose;
                state.track = plane.track;
                state.ground_speed = plane.ground_speed;
                state.anchor_ms = frame_start_ms;
                state.motion_valid = !stale_measurement;
                if (state.motion_valid) {
                  project_motion(plane.lat, plane.lon, plane.track,
                                 plane.ground_speed, measurement_age,
                                 state.anchor_lat, state.anchor_lon);
                } else {
                  id(flight_radar_stale_position_samples)++;
                }
                state.last_raw_lat = plane.lat;
                state.last_raw_lon = plane.lon;
                state.last_observation_ms = observation_ms;
              } else if (stale_measurement || repeated_position) {
                id(flight_radar_stale_position_samples)++;
              } else {
                float measured_lat = plane.lat;
                float measured_lon = plane.lon;
                project_motion(plane.lat, plane.lon, plane.track,
                               plane.ground_speed, measurement_age,
                               measured_lat, measured_lon);

                const float state_age = std::min(
                    MAX_EXTRAPOLATION_SECONDS,
                    (float) (frame_start_ms - state.anchor_ms) / 1000.0f);
                float expected_lat = state.anchor_lat;
                float expected_lon = state.anchor_lon;
                if (state.motion_valid) {
                  project_motion(state.anchor_lat, state.anchor_lon,
                                 state.track, state.ground_speed, state_age,
                                 expected_lat, expected_lon);
                }
                const float correction_m = position_distance_m(
                    expected_lat, expected_lon, measured_lat, measured_lon);
                if (correction_m > id(flight_radar_position_correction_max_m)) {
                  id(flight_radar_position_correction_max_m) = correction_m;
                }

                const bool low_integrity =
                    plane.position_mlat || plane.nic == 0;
                float correction_gate_m = low_integrity ? 1000.0f : 1500.0f;
                if (plane.rc > 0) {
                  correction_gate_m = std::max(
                      correction_gate_m,
                      std::min(3000.0f, 300.0f + 4.0f * plane.rc));
                }

                bool accept_measurement = correction_m <= correction_gate_m;
                bool reacquired = false;
                if (!accept_measurement) {
                  const float candidate_gate_m =
                      low_integrity ? 500.0f : 750.0f;
                  const uint8_t required_candidates =
                      low_integrity ? 4 : 2;
                  bool update_candidate = false;
                  if (state.candidate_valid) {
                    const bool candidate_observation_advanced =
                        (int32_t) (observation_ms
                                   - state.candidate_observation_ms) > 500;
                    const bool candidate_position_changed =
                        fabsf(plane.lat - state.candidate_raw_lat) >= 0.000002f
                        || fabsf(plane.lon - state.candidate_raw_lon) >= 0.000002f;
                    if (candidate_observation_advanced
                        && candidate_position_changed) {
                      const float candidate_age = std::min(
                          MAX_EXTRAPOLATION_SECONDS,
                          (float) (frame_start_ms - state.candidate_ms) / 1000.0f);
                      float candidate_lat = state.candidate_lat;
                      float candidate_lon = state.candidate_lon;
                      project_motion(state.candidate_lat, state.candidate_lon,
                                     state.candidate_track,
                                     state.candidate_ground_speed,
                                     candidate_age, candidate_lat, candidate_lon);
                      const float candidate_correction_m = position_distance_m(
                          candidate_lat, candidate_lon,
                          measured_lat, measured_lon);
                      if (candidate_correction_m <= candidate_gate_m) {
                        state.candidate_count++;
                      } else {
                        state.candidate_count = 1;
                        state.candidate_first_ms = frame_start_ms;
                      }
                      update_candidate = true;
                      const bool candidate_span_sufficient =
                          !low_integrity
                          || frame_start_ms - state.candidate_first_ms >= 8000UL;
                      accept_measurement =
                          state.candidate_count >= required_candidates
                          && candidate_span_sufficient;
                      reacquired = accept_measurement;
                    } else {
                      id(flight_radar_stale_position_samples)++;
                    }
                  } else {
                    state.candidate_valid = true;
                    state.candidate_count = 1;
                    state.candidate_first_ms = frame_start_ms;
                    update_candidate = true;
                  }

                  if (!accept_measurement) {
                    if (update_candidate) {
                      state.candidate_lat = measured_lat;
                      state.candidate_lon = measured_lon;
                      state.candidate_raw_lat = plane.lat;
                      state.candidate_raw_lon = plane.lon;
                      state.candidate_nose = plane.nose;
                      state.candidate_track = plane.track;
                      state.candidate_ground_speed = plane.ground_speed;
                      state.candidate_ms = frame_start_ms;
                      state.candidate_observation_ms = observation_ms;
                      id(flight_radar_position_rejections)++;
                      ESP_LOGW("flight_tracker",
                               "%s rejected %.0fm gate %.0fm age %.1fs source=%s mlat=%d nic=%d rc=%d candidate=%u/%u",
                               plane.callsign, correction_m, correction_gate_m,
                               measurement_age,
                               plane.source_type[0] != '\0'
                                   ? plane.source_type : "unknown",
                               plane.position_mlat ? 1 : 0, plane.nic, plane.rc,
                               state.candidate_count, required_candidates);
                    }
                  }
                }

                if (accept_measurement) {
                  state.anchor_lat = measured_lat;
                  state.anchor_lon = measured_lon;
                  state.nose = plane.nose;
                  state.track = plane.track;
                  state.ground_speed = plane.ground_speed;
                  state.anchor_ms = frame_start_ms;
                  state.motion_valid = true;
                  state.last_raw_lat = plane.lat;
                  state.last_raw_lon = plane.lon;
                  state.last_observation_ms = observation_ms;
                  state.candidate_valid = false;
                  state.candidate_count = 0;
                  if (reacquired) {
                    id(flight_radar_position_reacquisitions)++;
                    ESP_LOGI("flight_tracker",
                             "%s position reacquired after confirmed relocation",
                             plane.callsign);
                  }
                }
              }
            }

            const float state_age = std::min(
                MAX_EXTRAPOLATION_SECONDS,
                (float) (frame_start_ms - state.anchor_ms) / 1000.0f);
            plane.predicted_lat = state.anchor_lat;
            plane.predicted_lon = state.anchor_lon;
            if (state.motion_valid) {
              project_motion(state.anchor_lat, state.anchor_lon,
                             state.track, state.ground_speed, state_age,
                             plane.predicted_lat, plane.predicted_lon);
            }
            plane.nose = state.nose;
            plane.track = state.track;
            plane.ground_speed = state.ground_speed;
            plane_count++;
          }
          if (new_payload) {
            tracker_generation = id(flight_radar_payload_generation);
          }

          if (label_metrics_generation != id(flight_radar_payload_generation)) {
            auto measure_text = [&](const char *text, int &text_width,
                                    int &text_height) {
              int text_x0 = 0;
              int text_y0 = 0;
              text_width = 0;
              text_height = 0;
              if (text[0] == '\0') return;
              it.get_text_bounds(0, 0, text, id(font_radar_small),
                                 TextAlign::TOP_LEFT, &text_x0, &text_y0,
                                 &text_width, &text_height);
            };
            for (int index = 0; index < plane_count; index++) {
              LabelMetrics &metrics = label_metrics[index];
              int height = 0;
              metrics = {0, 0, 0, 0};
              measure_text(planes[index].callsign,
                           metrics.callsign_width, height);
              metrics.line_height = std::max(metrics.line_height, height);
              measure_text(planes[index].type, metrics.type_width, height);
              metrics.line_height = std::max(metrics.line_height, height);
              measure_text(planes[index].altitude,
                           metrics.altitude_width, height);
              metrics.line_height = std::max(metrics.line_height, height);
            }
            label_metrics_generation = id(flight_radar_payload_generation);
          }

          if (!has_data) {
            it.printf(CX, CY - 12, id(font_radar_large), LABEL,
                      TextAlign::CENTER, "NO DATA");
            std::string status = id(flight_radar_status).state.c_str();
            if (status.empty()) status = "waiting for ADS-B";
            it.printf(CX, CY + 16, id(font_radar_small), LABEL,
                      TextAlign::CENTER, "%s", status.c_str());
            mark_dirty(CX - 125, CY - 40, CX + 125, CY + 42);
            commit_dirty();
            return;
          }
          if (age_seconds > 15) {
            it.printf(CX, CY - 12, id(font_radar_large), LABEL,
                      TextAlign::CENTER, "STALE");
            it.printf(CX, CY + 16, id(font_radar_small), LABEL,
                      TextAlign::CENTER, "%lus old",
                      (unsigned long) age_seconds);
            mark_dirty(CX - 100, CY - 38, CX + 100, CY + 40);
          }

          struct DrawItem {
            int index;
            int x;
            int y;
            int distance_squared;
          };
          static DrawItem items[48];
          static DrawItem dots[48];
          int item_count = 0;
          int dot_count = 0;

          const int ICON_SIZE = 30;
          const int ICON_RADIUS = ICON_SIZE / 2;
          const int INSET = ICON_RADIUS + 2;
          const float INNER_MAX_KM =
              outer_km * ((float) (R - INSET) / (float) R);

          auto distance_squared_px = [&](int x, int y) {
            const int dx = x - CX;
            const int dy = y - CY;
            return dx * dx + dy * dy;
          };

          for (int index = 0; index < plane_count; index++) {
            float dx = 0.0f;
            float dy = 0.0f;
            float distance = 0.0f;
            offset_km(planes[index].predicted_lat,
                      planes[index].predicted_lon,
                      dx, dy, distance);
            if (distance <= INNER_MAX_KM) {
              int x = 0;
              int y = 0;
              float unused_distance = 0.0f;
              project(planes[index].predicted_lat,
                      planes[index].predicted_lon,
                      x, y, unused_distance);
              items[item_count++] =
                  {index, x, y, distance_squared_px(x, y)};
            } else if (distance > 0.01f) {
              const float angle = atan2f(dx, dy);
              const int x = CX + (int) lroundf(sinf(angle) * EDGE_R);
              const int y = CY - (int) lroundf(cosf(angle) * EDGE_R);
              dots[dot_count++] =
                  {index, x, y, distance_squared_px(x, y)};
            }
          }

          auto sort_far_first = [](DrawItem *array, int count) {
            for (int index = 1; index < count; index++) {
              const DrawItem key = array[index];
              int position = index;
              while (position > 0
                     && array[position - 1].distance_squared
                            < key.distance_squared) {
                array[position] = array[position - 1];
                position--;
              }
              array[position] = key;
            }
          };
          sort_far_first(dots, dot_count);
          sort_far_first(items, item_count);

          id(flight_radar_hit_count) = item_count;
          id(flight_radar_hit_generation) = id(flight_radar_payload_generation);
          for (int index = 0; index < item_count; index++) {
            id(flight_radar_hit_x)[index] = items[index].x;
            id(flight_radar_hit_y)[index] = items[index].y;
            id(flight_radar_hit_label_x0)[index] = -1;
            id(flight_radar_hit_label_y0)[index] = -1;
            id(flight_radar_hit_label_x1)[index] = -1;
            id(flight_radar_hit_label_y1)[index] = -1;
            id(flight_radar_hit_plane_index)[index] = items[index].index;
          }

          for (int index = 0; index < dot_count; index++) {
            it.filled_circle(dots[index].x, dots[index].y, 5, AIRCRAFT);
            mark_dirty(dots[index].x - 7, dots[index].y - 7,
                       dots[index].x + 8, dots[index].y + 8);
          }

          auto draw_plane_icon = [&](int x, int y, float heading) {
            const float radians = heading * DEG_TO_RAD;
            const float sin_heading = sinf(radians);
            const float cos_heading = cosf(radians);
            const int source_width = id(flight_radar_plane_icon).get_width();
            const int source_height = id(flight_radar_plane_icon).get_height();
            const float source_center_x = (source_width - 1) * 0.5f;
            const float source_center_y = (source_height - 1) * 0.5f;
            const float source_scale =
                (float) std::min(source_width, source_height) / ICON_SIZE;

            for (int icon_y = -ICON_RADIUS;
                 icon_y < ICON_SIZE - ICON_RADIUS; icon_y++) {
              for (int icon_x = -ICON_RADIUS;
                   icon_x < ICON_SIZE - ICON_RADIUS; icon_x++) {
                const float destination_x = icon_x + 0.5f;
                const float destination_y = icon_y + 0.5f;
                const float source_x = source_center_x
                    + (cos_heading * destination_x
                       + sin_heading * destination_y) * source_scale;
                const float source_y = source_center_y
                    + (-sin_heading * destination_x
                       + cos_heading * destination_y) * source_scale;
                const int source_x0 = (int) floorf(source_x);
                const int source_y0 = (int) floorf(source_y);
                const float fraction_x = source_x - source_x0;
                const float fraction_y = source_y - source_y0;

                const Color samples[4] = {
                  id(flight_radar_plane_icon).get_pixel(source_x0, source_y0),
                  id(flight_radar_plane_icon).get_pixel(source_x0 + 1, source_y0),
                  id(flight_radar_plane_icon).get_pixel(source_x0, source_y0 + 1),
                  id(flight_radar_plane_icon).get_pixel(source_x0 + 1,
                                                        source_y0 + 1),
                };
                const float weights[4] = {
                  (1.0f - fraction_x) * (1.0f - fraction_y),
                  fraction_x * (1.0f - fraction_y),
                  (1.0f - fraction_x) * fraction_y,
                  fraction_x * fraction_y,
                };

                float alpha = 0.0f;
                float red = 0.0f;
                float green = 0.0f;
                float blue = 0.0f;
                for (int sample = 0; sample < 4; sample++) {
                  const float sample_alpha =
                      weights[sample] * (samples[sample].w / 255.0f);
                  alpha += sample_alpha;
                  red += samples[sample].r * sample_alpha;
                  green += samples[sample].g * sample_alpha;
                  blue += samples[sample].b * sample_alpha;
                }
                if (alpha < 0.08f) continue;

                red /= alpha;
                green /= alpha;
                blue /= alpha;
                Color background = BG;
                const int destination_pixel_x = x + icon_x;
                const int destination_pixel_y = y + icon_y;
                if (show_map
                    && destination_pixel_x >= 0 && destination_pixel_x < W
                    && destination_pixel_y >= 0 && destination_pixel_y < H) {
                  background = active_map->get_pixel(
                      destination_pixel_x, destination_pixel_y);
                }
                const float inverse_alpha = 1.0f - alpha;
                const uint8_t output_red = (uint8_t) lroundf(
                    red * alpha + background.r * inverse_alpha);
                const uint8_t output_green = (uint8_t) lroundf(
                    green * alpha + background.g * inverse_alpha);
                const uint8_t output_blue = (uint8_t) lroundf(
                    blue * alpha + background.b * inverse_alpha);
                it.draw_pixel_at(x + icon_x, y + icon_y,
                                 Color(output_red, output_green, output_blue));
              }
            }
          };

          for (int draw_index = 0; draw_index < item_count; draw_index++) {
            const Plane &plane = planes[items[draw_index].index];
            const int x = items[draw_index].x;
            const int y = items[draw_index].y;

            draw_plane_icon(x, y, plane.nose);
            mark_dirty(x - ICON_RADIUS - 2, y - ICON_RADIUS - 2,
                       x + ICON_RADIUS + 3, y + ICON_RADIUS + 3);
          }

          struct Rect {
            int x0;
            int y0;
            int x1;
            int y1;
          };
          struct LabelSlot {
            int x0;
            int y0;
            int text_x;
            bool right_align;
          };
          static Rect placed_labels[48];
          int placed_label_count = 0;

          auto rectangles_overlap = [](const Rect &a, const Rect &b) -> bool {
            return a.x0 < b.x1 && a.x1 > b.x0
                && a.y0 < b.y1 && a.y1 > b.y0;
          };
          auto clamp_int = [](int value, int low, int high) -> int {
            return std::max(low, std::min(high, value));
          };
          const int MARK_CLEARANCE = ICON_RADIUS + 3;
          const int LABEL_PADDING = 4;
          const int LABEL_LINE_STEP = 15;
          auto label_is_clear = [&](const Rect &rectangle) -> bool {
            for (int index = 0; index < placed_label_count; index++) {
              if (rectangles_overlap(rectangle, placed_labels[index])) return false;
            }
            for (int index = 0; index < item_count; index++) {
              const Rect marker = {
                items[index].x - MARK_CLEARANCE,
                items[index].y - MARK_CLEARANCE,
                items[index].x + MARK_CLEARANCE + 1,
                items[index].y + MARK_CLEARANCE + 1,
              };
              if (rectangles_overlap(rectangle, marker)) return false;
            }
            for (int index = 0; index < dot_count; index++) {
              const Rect marker = {
                dots[index].x - 6,
                dots[index].y - 6,
                dots[index].x + 7,
                dots[index].y + 7,
              };
              if (rectangles_overlap(rectangle, marker)) return false;
            }
            return true;
          };

          auto make_label_slot = [&](int mode, int x, int y, int label_width,
                                     int label_height) -> LabelSlot {
            int x0 = x + MARK_CLEARANCE + 3;
            int y0 = y - label_height / 2;
            bool right_align = false;
            if (mode == 1) {
              x0 = x - MARK_CLEARANCE - 3 - label_width;
              right_align = true;
            } else if (mode == 2) {
              x0 = x + 4;
              y0 = y - MARK_CLEARANCE - 3 - label_height;
            } else if (mode == 3) {
              x0 = x - 4 - label_width;
              y0 = y - MARK_CLEARANCE - 3 - label_height;
              right_align = true;
            } else if (mode == 4) {
              x0 = x + 4;
              y0 = y + MARK_CLEARANCE + 3;
            } else if (mode == 5) {
              x0 = x - 4 - label_width;
              y0 = y + MARK_CLEARANCE + 3;
              right_align = true;
            }
            x0 = clamp_int(x0, 0, std::max(0, W - label_width));
            y0 = clamp_int(y0, 0, std::max(0, H - label_height));
            const int text_x =
                right_align ? x0 + label_width - LABEL_PADDING
                            : x0 + LABEL_PADDING;
            return {x0, y0, text_x, right_align};
          };

          auto try_draw_label = [&](const Plane &plane, int hit_index,
                                    int x, int y,
                                    bool draw_callsign, bool draw_type,
                                    bool draw_altitude) -> bool {
            const int line_count =
                (draw_callsign ? 1 : 0)
                + (draw_type ? 1 : 0)
                + (draw_altitude ? 1 : 0);
            if (line_count == 0) return false;

            const LabelMetrics &metrics =
                label_metrics[items[hit_index].index];
            int max_text_width = 0;
            if (draw_callsign) {
              max_text_width = std::max(max_text_width,
                                        metrics.callsign_width);
            }
            if (draw_type) {
              max_text_width = std::max(max_text_width,
                                        metrics.type_width);
            }
            if (draw_altitude) {
              max_text_width = std::max(max_text_width,
                                        metrics.altitude_width);
            }
            const int line_height = metrics.line_height;
            if (line_height <= 0) return false;

            const int LINE_STEP = LABEL_LINE_STEP;
            const int label_width = std::min(
                W, std::max(2 * LABEL_PADDING + 1,
                            max_text_width + 2 * LABEL_PADDING));
            const int label_height = std::min(
                H, 2 * LABEL_PADDING + line_height
                       + (line_count - 1) * LABEL_LINE_STEP);

            for (int mode = 0; mode < 6; mode++) {
              const LabelSlot slot =
                  make_label_slot(mode, x, y, label_width, label_height);
              const Rect rectangle = {
                slot.x0,
                slot.y0,
                slot.x0 + label_width,
                slot.y0 + label_height,
              };
              if (!label_is_clear(rectangle)) continue;

              it.filled_rectangle(slot.x0, slot.y0,
                                  label_width, label_height, BG);
              const TextAlign alignment =
                  slot.right_align ? TextAlign::TOP_RIGHT : TextAlign::TOP_LEFT;
              int line_y = slot.y0 + LABEL_PADDING;
              if (draw_callsign) {
                it.printf(slot.text_x, line_y, id(font_radar_small), LABEL,
                          alignment, "%s", plane.callsign);
                line_y += LINE_STEP;
              }
              if (draw_type) {
                it.printf(slot.text_x, line_y, id(font_radar_small), TYPE_COLOR,
                          alignment, "%s", plane.type);
                line_y += LINE_STEP;
              }
              if (draw_altitude) {
                it.printf(slot.text_x, line_y, id(font_radar_small),
                          ALTITUDE_COLOR, alignment, "%s", plane.altitude);
              }
              id(flight_radar_hit_label_x0)[hit_index] = rectangle.x0;
              id(flight_radar_hit_label_y0)[hit_index] = rectangle.y0;
              id(flight_radar_hit_label_x1)[hit_index] = rectangle.x1;
              id(flight_radar_hit_label_y1)[hit_index] = rectangle.y1;
              mark_dirty(rectangle.x0, rectangle.y0,
                         rectangle.x1, rectangle.y1);
              placed_labels[placed_label_count++] = rectangle;
              return true;
            }
            return false;
          };

          int degraded_label_count = 0;
          int skipped_label_count = 0;
          for (int draw_index = item_count - 1; draw_index >= 0; draw_index--) {
            const Plane &plane = planes[items[draw_index].index];
            const int x = items[draw_index].x;
            const int y = items[draw_index].y;
            const bool has_callsign = plane.callsign[0] != '\0';
            const bool has_type = plane.type[0] != '\0';
            const bool has_altitude = plane.altitude[0] != '\0';
            const int line_count =
                (has_callsign ? 1 : 0)
                + (has_type ? 1 : 0)
                + (has_altitude ? 1 : 0);
            if (line_count == 0) continue;

            if (try_draw_label(plane, draw_index, x, y,
                               has_callsign, has_type, has_altitude)) {
              continue;
            }
            if (line_count > 2
                && try_draw_label(plane, draw_index, x, y,
                                  has_callsign, has_type, false)) {
              degraded_label_count++;
              continue;
            }

            bool fallback_drawn = false;
            if (has_callsign) {
              fallback_drawn =
                  try_draw_label(plane, draw_index, x, y,
                                 true, false, false);
            } else if (has_type) {
              fallback_drawn =
                  try_draw_label(plane, draw_index, x, y,
                                 false, true, false);
            } else {
              fallback_drawn =
                  try_draw_label(plane, draw_index, x, y,
                                 false, false, true);
            }
            if (fallback_drawn) {
              degraded_label_count++;
            } else {
              skipped_label_count++;
            }
          }

          id(flight_radar_frame_duration_ms) = millis() - frame_start_ms;
          if (id(flight_radar_frame_duration_ms)
              > id(flight_radar_frame_max_duration_ms)) {
            id(flight_radar_frame_max_duration_ms) =
                id(flight_radar_frame_duration_ms);
          }
          id(flight_radar_frame_planes) = item_count + dot_count;
          id(flight_radar_frame_labels) = placed_label_count;
          id(flight_radar_frame_degraded_labels) = degraded_label_count;
          id(flight_radar_frame_skipped_labels) = skipped_label_count;
          const bool publish_slow_frame_diag =
              id(flight_radar_frame_duration_ms) > 95UL
              && frame_start_ms - id(flight_radar_frame_last_diag_ms)
                     >= 1000UL;
          if (publish_frame_diag || publish_slow_frame_diag) {
            id(flight_radar_frame_last_diag_ms) = millis();
            id(flight_radar_display_duration_ms_sensor).publish_state(
                id(flight_radar_frame_duration_ms));
            id(flight_radar_display_max_duration_ms_sensor).publish_state(
                id(flight_radar_frame_max_duration_ms));
            id(flight_radar_display_planes_sensor).publish_state(
                id(flight_radar_frame_planes));
            id(flight_radar_display_labels_sensor).publish_state(
                id(flight_radar_frame_labels));
            id(flight_radar_display_degraded_labels_sensor).publish_state(
                id(flight_radar_frame_degraded_labels));
            id(flight_radar_display_skipped_labels_sensor).publish_state(
                id(flight_radar_frame_skipped_labels));

            char breadcrumb[80];
            snprintf(breadcrumb, sizeof(breadcrumb),
                     "draw ok %ums %d planes %d labels d%d s%d",
                     (unsigned) id(flight_radar_frame_duration_ms),
                     id(flight_radar_frame_planes),
                     id(flight_radar_frame_labels),
                     id(flight_radar_frame_degraded_labels),
                     id(flight_radar_frame_skipped_labels));
            id(flight_radar_breadcrumb).publish_state(breadcrumb);
          }

          it.printf(5, H - 17, id(font_radar_small), GRID,
                    TextAlign::BOTTOM_LEFT, "%d AC", plane_count);
          mark_dirty(0, H - 35, 90, H);
          if (id(flight_radar_fetch_in_progress)) {
            it.printf(W - 5, H - 17, id(font_radar_small), GRID,
                      TextAlign::BOTTOM_RIGHT, "FETCH");
          } else {
            it.printf(W - 5, H - 17, id(font_radar_small), GRID,
                      TextAlign::BOTTOM_RIGHT, "%lus",
                      (unsigned long) age_seconds);
          }
          mark_dirty(W - 90, H - 35, W, H);
          commit_dirty();
